<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RouteCraft</title>

    <!-- Leaflet CSS, D3.js & dom-to-image -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" crossorigin="anonymous" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            height: 100dvh;
            background-color: #f6f7f9;
            color: #111;
            overflow: hidden;
            position: relative;
        }

        #sidebar {
            width: 370px;
            max-width: 100vw;
            height: 100%;
            min-height: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-right: 1px solid #e0e0e0;
            z-index: 1000;
            overscroll-behavior: contain;
            touch-action: pan-y;
            transition: all 0.25s ease;
        }

        body.sidebar-collapsed #sidebar {
            width: 0 !important;
            min-width: 0 !important;
            max-height: 0 !important;
            overflow: hidden !important;
            border: none !important;
            padding: 0 !important;
        }

        .sidebar-sticky-top {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
            flex-shrink: 0;
        }

        .header {
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #111;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .toggle-btn {
            appearance: none;
            border: 1px solid #ddd;
            background: #fafafa;
            color: #333;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.05rem;
            line-height: 1;
            width: auto;
        }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 7px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
        }

        #floating-menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 2000;
            background: #ffffff;
            border: 1px solid #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            color: #111;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: auto;
        }

        body.sidebar-collapsed #floating-menu-btn {
            display: block;
        }

        .leaflet-top.leaflet-left {
            top: 60px !important;
        }

        .route-summary-card {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            flex-shrink: 0;
        }

        .summary-metric {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .summary-metric-waypoints {
            text-align: right;
            padding-left: 12px;
            border-left: 1px solid #e5e7eb;
        }

        .summary-metric-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
        }

        .summary-metric-value {
            font-size: 0.92rem;
            font-weight: 700;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        input, textarea, button {
            padding: 9px 11px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #fff;
            color: #111;
            font-size: 0.92rem;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 40px;
            line-height: 1.4;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #2b8ed6;
            box-shadow: 0 0 0 3px rgba(43, 142, 214, 0.15);
        }

        button {
            background: #2b8ed6;
            border: none;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        button:hover { background: #2374b0; }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button:disabled:hover {
            background: #2b8ed6;
        }

        button.secondary {
            background: #f5f6f7;
            border: 1px solid #ddd;
            color: #111;
        }

        button.secondary:hover { background: #e8eaed; }

        button.secondary:disabled:hover {
            background: #f5f6f7;
        }

        button.secondary.active-mode {
            background: #e6f3fc;
            border-color: #2b8ed6;
            color: #16659e;
        }

        button.danger {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        button.danger:hover {
            background: #fecaca;
        }

        .controls-btn-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .controls-btn-grid button {
            padding: 8px 10px;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .color-picker-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 2px;
        }

        .color-picker-row label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }

        .color-picker-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-controls input[type="color"] {
            width: 40px;
            height: 30px;
            padding: 2px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            flex-shrink: 0;
        }

        .color-hex-label {
            font-size: 0.78rem;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-variant-numeric: tabular-nums;
            color: #475569;
            min-width: 60px;
            text-align: right;
        }

        .map-style-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 2px;
        }

        .map-style-row label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
        }

        .map-style-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
            min-width: 0;
        }

        .map-style-controls select {
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #111827;
            font-size: 0.82rem;
            font-weight: 600;
            max-width: 158px;
            cursor: pointer;
        }

        .os-grid-toggle-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.78rem !important;
            font-weight: 600;
            color: #0369a1 !important;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }

        .os-grid-toggle-label input[type="checkbox"] {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: #0284c7;
            cursor: pointer;
        }

        .routing-options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 2px;
        }

        .routing-options-row > label:first-child {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
        }

        .routing-controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
            min-width: 0;
        }

        .routing-controls-group select {
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #111827;
            font-size: 0.82rem;
            font-weight: 600;
            max-width: 158px;
            cursor: pointer;
        }

        .snap-toggle-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #0f172a;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }

        .snap-toggle-label.is-disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .snap-toggle-label input[type="checkbox"] {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: #2b8ed6;
            cursor: pointer;
        }

        .sidebar-scroll {
            flex: 1 0 auto;
            padding: 12px 16px 18px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-header-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .section-header-row .section-title {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #666;
            margin-bottom: 8px;
        }

        .route-distance-display {
            font-size: 0.78rem;
            font-weight: 600;
            color: #16659e;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Waypoint & Textbox Editor Lists in Sidebar */
        #waypoint-editor-list, #textbox-editor-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .wp-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fff;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
        }

        .wp-row-top {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .wp-num {
            background: #2b8ed6;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tb-badge-num {
            background: #d97706;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .wp-row input, .wp-row textarea {
            padding: 6px 8px;
            font-size: 0.85rem;
            border: 1px solid #ddd;
            background: #fff;
        }

        .wp-note-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wp-icon-field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .wp-icon-select {
            flex: 1;
            min-width: 0;
            padding: 5px 8px;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
            color: #1f2937;
            cursor: pointer;
        }

        .wp-icon-select:focus {
            outline: none;
            border-color: #2b8ed6;
            box-shadow: 0 0 0 2px rgba(43, 142, 214, 0.18);
        }

        .wp-direct-field {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .wp-direct-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            user-select: none;
        }

        .wp-direct-label input[type="checkbox"] {
            width: 14px;
            height: 14px;
            margin: 0;
            accent-color: #2b8ed6;
            cursor: pointer;
        }

        .wp-note-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #666;
        }

        .wp-note-textarea {
            color: #333;
            font-size: 0.82rem !important;
            background: #fafafa !important;
            min-height: 44px;
            resize: vertical;
            line-height: 1.35;
        }

        .wp-del-btn {
            position: relative;
            min-width: 44px;
            min-height: 44px;
            width: 44px;
            height: 44px;
            padding: 0;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            font-size: 1rem;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        .wp-del-btn:hover {
            background: #fecaca;
        }

        .tb-row-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .tb-locate-btn {
            padding: 5px 10px;
            font-size: 0.78rem;
            width: auto;
        }

        .route-card {
            background: #fff;
            border: 1px solid #ececec;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: box-shadow 0.15s, border-color 0.15s;
        }

        .route-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-color: #d6eaf9;
        }

        .route-card h3 { font-size: 1rem; margin-bottom: 4px; color: #111; }
        .route-card p { font-size: 0.85rem; color: #666; }
        .route-card .route-card-notes {
            margin-top: 6px;
            font-size: 0.82rem;
            color: #444;
            background: #f8f9fb;
            border: 1px solid #eceff3;
            border-radius: 5px;
            padding: 6px 8px;
            white-space: pre-wrap;
        }

        .route-edit-fields {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
        }

        .route-edit-fields input, .route-edit-fields textarea {
            padding: 6px 8px;
            font-size: 0.85rem;
        }

        .card-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
        .card-actions button { padding: 6px 8px; font-size: 0.82rem; flex: 1; min-width: 64px; }

        #map-workspace {
            flex: 1;
            min-width: 0;
            min-height: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #e9eef5;
        }

        #map {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: #e9eef5;
        }

        .os-landranger-tiles {
            filter: contrast(1.06) saturate(1.14) brightness(1.01);
        }

        #map.placing-textbox {
            cursor: crosshair !important;
        }

        /* Elevation & Terrain Incline Panel below Map */
        #elevation-panel {
            flex-shrink: 0;
            height: 168px;
            background: #ffffff;
            border-top: 1px solid #d4d8dd;
            display: flex;
            flex-direction: column;
            transition: height 0.2s ease;
            z-index: 900;
        }

        #elevation-panel.is-empty,
        #elevation-panel.is-collapsed {
            height: 36px;
        }

        #elevation-panel.is-empty .elevation-chart-wrap,
        #elevation-panel.is-collapsed .elevation-chart-wrap {
            display: none;
        }

        .elevation-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 12px;
            min-height: 35px;
            border-bottom: 1px solid #eef2f6;
            background: #f8fafc;
            flex-shrink: 0;
        }

        #elevation-panel.is-empty .elevation-header,
        #elevation-panel.is-collapsed .elevation-header {
            border-bottom: none;
        }

        .elevation-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .elevation-title {
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #334155;
            white-space: nowrap;
        }

        .elevation-status {
            font-size: 0.76rem;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .elevation-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.76rem;
            font-weight: 600;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .elev-stat-up { color: #059669; }
        .elev-stat-down { color: #0284c7; }
        .elev-stat-grade { color: #d97706; }

        .incline-legend {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #475569;
        }

        .incline-swatch {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .incline-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .elevation-toggle-btn {
            width: 28px;
            height: 24px;
            padding: 0;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            border-radius: 5px;
            font-size: 0.85rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .elevation-toggle-btn:hover {
            background: #f1f5f9;
        }

        .elevation-chart-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        #elevation-svg {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .elevation-tooltip {
            position: absolute;
            top: 6px;
            right: 10px;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.74rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            white-space: nowrap;
        }

        .elevation-tooltip.visible {
            opacity: 1;
        }

        .leaflet-routing-container { display: none !important; }

        .hint { font-size: 0.8rem; color: #666; line-height: 1.35; }

        /* Toast notification */
        #toast-banner {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 3000;
            background: #1f2937;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.86rem;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            max-width: 320px;
        }

        #toast-banner.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* PDF / Print Preview Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3500;
            background: rgba(15, 23, 42, 0.55);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-header h2 {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .modal-close-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 6px;
            background: #f1f5f9;
            color: #334155;
            font-size: 1.05rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close-btn:hover {
            background: #e2e8f0;
        }

        .modal-body {
            padding: 14px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pdf-preview-meta {
            font-size: 0.84rem;
            color: #475569;
            font-variant-numeric: tabular-nums;
        }

        .pdf-preview-frame {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #e9eef5;
        }

        .pdf-preview-frame img {
            display: block;
            width: 100%;
            max-height: 290px;
            object-fit: contain;
        }

        /* Editable Map Waypoint Badge */

        .waypoint-map-input {

            padding: 3px 6px;

            pointer-events: auto;

        .waypoint-map-input:focus {
            background: #ffffff;
            color: #111111;
            border-color: #ffffff;
            box-shadow: none;
            outline: none;
        }

        .waypoint-map-input:focus::placeholder {
            color: #888888;
        }

        .wp-map-del {
            position: relative;
            width: 24px;
            height: 24px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.28);
            color: #ffffff;
            font-size: 11px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            pointer-events: auto;
            touch-action: manipulation;
        }

        .wp-map-del::after {
            content: '';
            position: absolute;
            inset: -5px;
        }

        .wp-map-del:hover {
            background: #dc2626;
        }

        /* Draggable Editable Map Text Box */
        .map-textbox-card {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);

            overflow: hidden;
            pointer-events: auto;
        }

        .map-textbox-card:focus-within {
            border-color: #2b8ed6;
            box-shadow: 0 4px 14px rgba(43, 142, 214, 0.28);
        }

        .map-textbox-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fef3c7;
            border-bottom: 1px solid #fde68a;
            padding: 3px 6px;
            cursor: grab;
            user-select: none;
        }

        .map-textbox-header:active {
            cursor: grabbing;
        }

        .map-textbox-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #92400e;
        }

        .map-textbox-del {
            position: relative;
            width: 24px;
            height: 24px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #92400e;
            font-size: 12px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
        }

        .map-textbox-del::after {
            content: '';
            position: absolute;
            inset: -5px;
        }

        .map-textbox-del:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        .map-textbox-input {
            display: block;
            width: 100%;
            min-height: 46px;
            max-height: 140px;
            padding: 6px 8px;
            border: none;
            border-radius: 0;
            background: #ffffff;
            color: #111827;
            font-size: 12px;
            line-height: 1.35;
            resize: none;
            cursor: text;
            pointer-events: auto;
            touch-action: manipulation;
        }

        .map-textbox-input:focus {
            outline: none;
            box-shadow: none;
            border: none;
        }

        /* Dark Mode Theme Overrides */

        body.dark-mode .color-picker-row label,

        body.dark-mode .os-grid-toggle-label,

        body.dark-mode .sidebar-scroll {

        }

        body.dark-mode .wp-row,

        body.dark-mode .route-card:hover {

        /* Print / PDF Document Sheet */
        #print-sheet {
            display: none;
        }

        @media print {
            @page {
                size: auto;
                margin: 12mm;
            }

            html, body {
                height: auto !important;
                overflow: visible !important;
                display: block !important;
                background: #ffffff !important;
                color: #111111 !important;
            }

            #sidebar,
            #map-workspace,
            #floating-menu-btn,
            #toast-banner,
            #pdf-preview-modal,
            #png-preview-modal {
                display: none !important;
            }

            #print-sheet {
                display: block !important;
                width: 100%;
                color: #0f172a;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }

            .print-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 16px;
                padding-bottom: 12px;
                border-bottom: 2px solid #0f172a;
                margin-bottom: 14px;
            }

            .print-title {
                font-size: 20pt;
                font-weight: 700;
                color: #0f172a;
                margin-bottom: 4px;
            }

            .print-meta {
                font-size: 9.5pt;
                color: #475569;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                font-variant-numeric: tabular-nums;
            }

            .print-color-dot {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                vertical-align: middle;
                margin-right: 4px;
                border: 1px solid rgba(0,0,0,0.2);
            }

            .print-brand {
                font-size: 9pt;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #64748b;
                white-space: nowrap;
            }

            .print-map-frame {
                margin-bottom: 14px;
                border: 1px solid #cbd5e1;
                border-radius: 6px;
                overflow: hidden;
                background: #e9eef5;
                text-align: center;
                break-inside: avoid;
            }

            #print-map-img {
                display: block;
                width: 100%;
                max-height: 430px;
                object-fit: contain;
            }

            .print-section {
                margin-bottom: 14px;
                break-inside: avoid;
            }

            .print-section-title {
                font-size: 9pt;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                color: #475569;
                margin-bottom: 6px;
            }

            .print-notes-box {
                background: #f8fafc;
                border: 1px solid #e2e8f0;
                border-radius: 6px;
                padding: 8px 10px;
                font-size: 9.5pt;
                line-height: 1.45;
                white-space: pre-wrap;
            }

            .print-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 9pt;
            }

            .print-table th,
            .print-table td {
                border: 1px solid #cbd5e1;
                padding: 6px 8px;
                text-align: left;
                vertical-align: top;
            }

            .print-table th {
                background: #f1f5f9;
                font-weight: 700;
                color: #334155;
            }

            .print-table td.num-col {
                width: 34px;
                text-align: center;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }

            .print-table td.coord-col {
                width: 155px;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 8.2pt;
                font-variant-numeric: tabular-nums;
                color: #475569;
            }
        }
    </style>
</head>
<body>
    <button id="floating-menu-btn" title="Open Menu">☰ Menu</button>

    <div id="sidebar" aria-hidden="false">
        <div class="sidebar-sticky-top">
            <div class="header">
                <h1>RouteCraft</h1>
                <div class="header-actions">
                    <button id="theme-toggle-btn" type="button" class="toggle-btn theme-toggle-btn" title="Switch to dark mode" aria-label="Toggle dark mode" aria-pressed="false">🌙 Dark</button>
                    <button id="sidebar-toggle" class="toggle-btn" title="Toggle sidebar">☰</button>
                </div>
            </div>

            <div id="route-summary-card" class="route-summary-card" aria-live="polite">
                <div class="summary-metric">
                    <span class="summary-metric-label">Total Distance</span>
                    <span id="summary-distance" class="summary-metric-value">0.0 km / 0.0 mi</span>
                </div>
                <div class="summary-metric summary-metric-waypoints">
                    <span class="summary-metric-label">Waypoints</span>
                    <span id="summary-waypoints" class="summary-metric-value">0</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="route-name" placeholder="Enter route name..." />
            <textarea id="route-notes" rows="1" placeholder="Enter route notes, briefing, or instructions..."></textarea>
            <div class="color-picker-row">
                <label for="route-color-picker">Route Color</label>
                <div class="color-picker-controls">
                    <span id="route-color-hex" class="color-hex-label">#2B8ED6</span>
                    <input type="color" id="route-color-picker" value="#2b8ed6" aria-label="Route polyline color" />
                </div>
            </div>
            <div class="map-style-row">
                <label for="map-style-select">Map Style</label>
                <div class="map-style-controls">
                    <select id="map-style-select" aria-label="Map tile style">
                        <option value="landranger" selected>OS Landranger Topo</option>
                        <option value="osm">Standard Street (OSM)</option>
                        <option value="cyclosm">Topo &amp; Contours</option>
                        <option value="dark">Dark Matter (Night)</option>
                    </select>
                    <label class="os-grid-toggle-label" title="Show British National Grid (OSGB36) 1km squares">
                        <input type="checkbox" id="os-grid-toggle" checked />
                        OS Grid
                    </label>
                </div>
            </div>
            <div class="routing-options-row">
                <label for="routing-mode-select">Routing</label>
                <div class="routing-controls-group">
                    <select id="routing-mode-select" aria-label="Routing mode">
                        <option value="rally" selected>Rally / Stage Roads</option>
                        <option value="roads">Public Roads (Car)</option>
                        <option value="direct">Direct (Exact)</option>
                    </select>
                    <label id="snap-toggle-label" class="snap-toggle-label" title="Snap dropped and dragged waypoints onto the nearest road">
                        <input type="checkbox" id="snap-roads-toggle" checked />
                        Snap
                    </label>
                </div>
            </div>
            <p class="hint" id="mode-hint">Rally / Stage Roads (Valhalla): follows tarmac, private/MOD &amp; forestry stage roads.</p>
            <div class="routing-options-row">
                <label for="hide-shaping-toggle">Markers</label>
                <label class="snap-toggle-label" title="Hide unnamed shaping waypoints (no label and default Waypoint icon) on the map while keeping Start, Finish, Controls, and named points visible">
                    <input type="checkbox" id="hide-shaping-toggle" checked />
                    Hide unnamed shaping points
                </label>
            </div>
            <div class="controls-btn-grid">
                <button id="undo-btn" type="button" class="secondary" disabled title="Undo last route change (Ctrl+Z)">↶ Undo</button>
                <button id="redo-btn" type="button" class="secondary" disabled title="Redo route change (Ctrl+Y)">↷ Redo</button>
                <button id="save-btn">Save Route</button>
                <button id="add-textbox-btn" class="secondary">+ Text Box</button>
                <button id="import-btn" class="secondary">Import GPX</button>
                <button id="clear-btn" class="secondary">Clear</button>
                <button id="export-png-btn" class="secondary">Export PNG</button>
                <button id="print-pdf-btn" class="secondary">Print / PDF</button>
            </div>
            <input type="file" id="gpx-file-input" accept=".gpx" style="display: none;" />
        </div>

        <div class="sidebar-scroll">
            <div id="active-waypoints-section" style="display: none;">
                <div class="section-header-row">
                    <div class="section-title">Active Waypoints</div>
                    <div id="route-distance-display" class="route-distance-display" aria-live="polite"></div>
                </div>
                <div id="waypoint-editor-list"></div>
            </div>

            <div id="active-textboxes-section" style="display: none;">
                <div class="section-title">Map Text Boxes</div>
                <div id="textbox-editor-list"></div>
            </div>

            <div>
                <div class="section-title">Saved Routes</div>
                <div id="route-list"></div>
            </div>
        </div>
    </div>

    <div id="map-workspace">
        <div id="map" role="region" aria-label="Map"></div>
        <section id="elevation-panel" class="is-empty" aria-label="Route Elevation Profile">
