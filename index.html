<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RouteCraft</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f6f7f9;
            color: #111;
            overflow: hidden;
            position: relative;
        }

        #sidebar {
            width: 370px;
            max-width: 100vw;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
            z-index: 1000;
            transition: all 0.25s ease;
        }

        body.sidebar-collapsed #sidebar {
            width: 0 !important;
            min-width: 0 !important;
            max-height: 0 !important;
            overflow: hidden;
            border: none !important;
            padding: 0 !important;
        }

        .header {
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #111;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toggle-btn {
            appearance: none;
            border: 1px solid #ddd;
            background: #fafafa;
            color: #333;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            width: auto;
        }

        #floating-menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 2000;
            background: #ffffff;
            border: 1px solid #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            color: #111;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: auto;
        }

        body.sidebar-collapsed #floating-menu-btn {
            display: block;
        }

        .leaflet-top.leaflet-left {
            top: 60px !important;
        }

        .controls {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid #eee;
        }

        input, textarea, button {
            padding: 9px 11px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #fff;
            color: #111;
            font-size: 0.92rem;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 54px;
            line-height: 1.4;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #2b8ed6;
            box-shadow: 0 0 0 3px rgba(43, 142, 214, 0.15);
        }

        button {
            background: #2b8ed6;
            border: none;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        button:hover { background: #2374b0; }

        button.secondary {
            background: #f5f6f7;
            border: 1px solid #ddd;
            color: #111;
        }

        button.secondary:hover { background: #e8eaed; }

        button.secondary.active-mode {
            background: #e6f3fc;
            border-color: #2b8ed6;
            color: #16659e;
        }

        button.danger {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        button.danger:hover {
            background: #fecaca;
        }

        .btn-group { display: flex; gap: 6px; }

        .sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #666;
            margin-bottom: 8px;
        }

        /* Waypoint Editor List in Sidebar */
        #waypoint-editor-list, #textbox-editor-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .wp-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fff;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
        }

        .wp-row-top {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .wp-num {
            background: #2b8ed6;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tb-badge-num {
            background: #d97706;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .wp-row input, .wp-row textarea {
            padding: 6px 8px;
            font-size: 0.85rem;
            border: 1px solid #ddd;
            background: #fff;
        }

        .wp-note-input {
            color: #444;
            font-size: 0.82rem !important;
            background: #fafafa !important;
        }

        .wp-del-btn {
            width: 30px;
            height: 30px;
            padding: 0;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            font-size: 0.9rem;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
        }

        .wp-del-btn:hover {
            background: #fecaca;
        }

        .tb-row-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .tb-locate-btn {
            padding: 4px 8px;
            font-size: 0.78rem;
            width: auto;
        }

        .route-card {
            background: #fff;
            border: 1px solid #ececec;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: box-shadow 0.15s, border-color 0.15s;
        }

        .route-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-color: #d6eaf9;
        }

        .route-card h3 { font-size: 1rem; margin-bottom: 4px; color: #111; }
        .route-card p { font-size: 0.85rem; color: #666; }
        .route-card .route-card-notes {
            margin-top: 6px;
            font-size: 0.82rem;
            color: #444;
            background: #f8f9fb;
            border: 1px solid #eceff3;
            border-radius: 5px;
            padding: 6px 8px;
            white-space: pre-wrap;
        }

        .route-edit-fields {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
        }

        .route-edit-fields input, .route-edit-fields textarea {
            padding: 6px 8px;
            font-size: 0.85rem;
        }

        .card-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
        .card-actions button { padding: 6px 8px; font-size: 0.82rem; flex: 1; min-width: 64px; }

        #map {
            flex: 1;
            height: 100%;
            background: #e9eef5;
        }

        #map.placing-textbox {
            cursor: crosshair !important;
        }

        .leaflet-routing-container { display: none !important; }

        .hint { font-size: 0.8rem; color: #666; line-height: 1.35; }

        /* Toast notification */
        #toast-banner {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 3000;
            background: #1f2937;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.86rem;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            max-width: 320px;
        }

        #toast-banner.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            body { flex-direction: column; }

            #sidebar {
                width: 100%;
                max-height: 48vh;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }

            #map { height: 52vh; flex: 1; }
        }

        /* Editable Map Waypoint Badge */
        .waypoint-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #2b8ed6;
            color: white;
            border-radius: 18px;
            padding: 3px 6px 3px 4px;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            white-space: nowrap;
            cursor: grab;
        }

        .waypoint-badge:active {
            cursor: grabbing;
        }

        .waypoint-badge .number {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
            user-select: none;
        }

        .waypoint-map-input {
            width: 72px;
            min-width: 48px;
            max-width: 180px;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            line-height: 1.25;
            cursor: text;
        }

        .waypoint-map-input::placeholder {
            color: rgba(255, 255, 255, 0.78);
            font-weight: 500;
        }

        .waypoint-map-input:focus {
            background: #ffffff;
            color: #111111;
            border-color: #ffffff;
            box-shadow: none;
            outline: none;
        }

        .waypoint-map-input:focus::placeholder {
            color: #888888;
        }

        .wp-map-del {
            width: 17px;
            height: 17px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.22);
            color: #ffffff;
            font-size: 10px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .wp-map-del:hover {
            background: #dc2626;
        }

        /* Draggable Editable Map Text Box */
        .map-textbox-card {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
            width: 196px;
            overflow: hidden;
        }

        .map-textbox-card:focus-within {
            border-color: #2b8ed6;
            box-shadow: 0 4px 14px rgba(43, 142, 214, 0.28);
        }

        .map-textbox-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fef3c7;
            border-bottom: 1px solid #fde68a;
            padding: 3px 6px;
            cursor: grab;
            user-select: none;
        }

        .map-textbox-header:active {
            cursor: grabbing;
        }

        .map-textbox-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #92400e;
        }

        .map-textbox-del {
            width: 18px;
            height: 18px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #92400e;
            font-size: 11px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .map-textbox-del:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        .map-textbox-input {
            display: block;
            width: 100%;
            min-height: 46px;
            max-height: 140px;
            padding: 6px 8px;
            border: none;
            border-radius: 0;
            background: #ffffff;
            color: #111827;
            font-size: 12px;
            line-height: 1.35;
            resize: none;
            cursor: text;
        }

        .map-textbox-input:focus {
            outline: none;
            box-shadow: none;
            border: none;
        }
    </style>
</head>
<body>
    <button id="floating-menu-btn" title="Open Menu">☰ Menu</button>

    <div id="sidebar" aria-hidden="false">
        <div class="header">
            <h1>RouteCraft</h1>
            <div>
                <button id="sidebar-toggle" class="toggle-btn" title="Toggle sidebar">☰</button>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="route-name" placeholder="Enter route name..." />
            <textarea id="route-notes" placeholder="Enter route notes, briefing, or instructions..."></textarea>
            <p class="hint" id="mode-hint">Tap map to drop waypoints. Edit names directly on map badges or in the sidebar. Drag badges to move.</p>
            <div class="btn-group">
                <button id="save-btn">Save Route</button>
                <button id="add-textbox-btn" class="secondary">+ Text Box</button>
            </div>
            <div class="btn-group">
                <button id="import-btn" class="secondary">Import GPX</button>
                <button id="clear-btn" class="secondary">Clear</button>
            </div>
            <input type="file" id="gpx-file-input" accept=".gpx" style="display: none;" />
        </div>

        <div class="sidebar-scroll">
            <div id="active-waypoints-section" style="display: none;">
                <div class="section-title">Active Waypoints</div>
                <div id="waypoint-editor-list"></div>
            </div>

            <div id="active-textboxes-section" style="display: none;">
                <div class="section-title">Map Text Boxes</div>
                <div id="textbox-editor-list"></div>
            </div>

            <div>
                <div class="section-title">Saved Routes</div>
                <div id="route-list"></div>
            </div>
        </div>
    </div>

    <div id="map" role="region" aria-label="Map"></div>
    <div id="toast-banner" role="status" aria-live="polite"></div>

    <!-- Leaflet JS & Routing Engine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        let map = null;
        let routingControl = null;
        let currentWaypoints = []; // { lat, lng, label, note }
        let currentTextBoxes = []; // { id, lat, lng, text }
        let currentRouteGeometry = [];
        let waypointMarkers = [];
        let textBoxMarkers = [];
        let memoryStorage = [];
        let isPlacingTextBox = false;
        let editingRouteId = null;
        let toastTimer = null;

        function showToast(message) {
            const el = document.getElementById('toast-banner');
            if (!el) return;
            el.textContent = message;
            el.classList.add('visible');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('visible');
            }, 2600);
        }

        function getSavedDrives() {
            try {
                const raw = localStorage.getItem('saved_drives');
                return raw ? JSON.parse(raw) : memoryStorage;
            } catch (e) {
                return memoryStorage;
            }
        }

        function setSavedDrives(drives) {
            memoryStorage = drives;
            try {
                localStorage.setItem('saved_drives', JSON.stringify(drives));
            } catch (e) {
                console.warn('LocalStorage blocked; stored in session memory instead.');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        function measureInputWidth(text, placeholder) {
            const sample = (text && text.length > 0) ? text : (placeholder || 'Point 1');
            const px = Math.min(180, Math.max(54, sample.length * 7.5 + 18));
            return px + 'px';
        }

        function autoResizeTextarea(textarea) {
            if (!textarea) return;
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(140, Math.max(46, textarea.scrollHeight)) + 'px';
        }

        function stopMarkerEventPropagation(el) {
            if (!el) return;
            ['mousedown', 'pointerdown', 'touchstart', 'click', 'dblclick'].forEach(evt => {
                el.addEventListener(evt, (e) => {
                    e.stopPropagation();
                });
            });
        }

        function setTextBoxPlacementMode(active) {
            isPlacingTextBox = active;
            const btn = document.getElementById('add-textbox-btn');
            const mapEl = document.getElementById('map');
            const hintEl = document.getElementById('mode-hint');

            if (btn) {
                btn.classList.toggle('active-mode', active);
                btn.textContent = active ? 'Cancel Text Box' : '+ Text Box';
            }
            if (mapEl) {
                mapEl.classList.toggle('placing-textbox', active);
            }
            if (hintEl) {
                hintEl.textContent = active
                    ? 'Tap anywhere on the map to drop an editable text box.'
                    : 'Tap map to drop waypoints. Edit names directly on map badges or in the sidebar. Drag badges to move.';
            }
        }

        function initRouting() {
            if (routingControl) return;
            routingControl = L.Routing.control({
                waypoints: [],
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1'
                }),
                lineOptions: {
                    styles: [{ color: '#2b8ed6', opacity: 0.9, weight: 5 }]
                },
                addWaypoints: false,
                draggableWaypoints: false,
                createMarker: () => null,
                fitSelectedRoutes: false,
                show: false
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                if (e.routes && e.routes[0] && e.routes[0].coordinates) {
                    currentRouteGeometry = e.routes[0].coordinates.map(c => ({ lat: c.lat, lng: c.lng }));
                }
            });
        }

        function updateRoutingWaypoints() {
            if (!routingControl) return;
            const latLngs = currentWaypoints.map(wp => L.latLng(wp.lat, wp.lng));
            routingControl.setWaypoints(latLngs);
        }

        function createIconForWaypoint(wp, index) {
            const placeholderText = `Point ${index + 1}`;
            const widthStyle = measureInputWidth(wp.label, placeholderText);
            return L.divIcon({
                className: '',
                html: `
                    <div class="waypoint-badge">
                        <span class="number" title="Drag to move">${index + 1}</span>
                        <input
                            type="text"
                            class="waypoint-map-input"
                            value="${escapeHtml(wp.label || '')}"
                            placeholder="${placeholderText}"
                            style="width: ${widthStyle};"
                            aria-label="Waypoint ${index + 1} name"
                        />
                        <button type="button" class="wp-map-del" title="Remove waypoint">✕</button>
                    </div>
                `,
                iconSize: [null, 30],
                iconAnchor: [15, 15]
            });
        }

        function createIconForTextBox(tb) {
            return L.divIcon({
                className: '',
                html: `
                    <div class="map-textbox-card">
                        <div class="map-textbox-header" title="Drag to move text box">
                            <span class="map-textbox-title">⠿ Note</span>
                            <button type="button" class="map-textbox-del" title="Remove text box">✕</button>
                        </div>
                        <textarea class="map-textbox-input" placeholder="Type map note...">${escapeHtml(tb.text || '')}</textarea>
                    </div>
                `,
                iconSize: [196, null],
                iconAnchor: [98, 12]
            });
        }

        function removeWaypointAtIndex(index) {
            currentWaypoints.splice(index, 1);
            updateRoutingWaypoints();
            syncMarkersToWaypoints();
        }

        function removeTextBoxAtIndex(index) {
            currentTextBoxes.splice(index, 1);
            syncTextBoxMarkers();
        }

        function renderSidebarWaypointList() {
            const section = document.getElementById('active-waypoints-section');
            const list = document.getElementById('waypoint-editor-list');
            if (!section || !list) return;

            if (currentWaypoints.length === 0) {
                section.style.display = 'none';
                list.innerHTML = '';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = '';

            currentWaypoints.forEach((wp, idx) => {
                const row = document.createElement('div');
                row.className = 'wp-row';
                row.innerHTML = `
                    <div class="wp-row-top">
                        <span class="wp-num">${idx + 1}</span>
                        <input type="text" class="wp-label-input" value="${escapeHtml(wp.label || '')}" placeholder="Point ${idx + 1} (e.g. Start, Control 1)" data-wp-idx="${idx}" />
                        <button type="button" class="wp-del-btn" title="Remove waypoint">✕</button>
                    </div>
                    <input type="text" class="wp-note-input" value="${escapeHtml(wp.note || '')}" placeholder="Waypoint note or instruction..." data-wp-note-idx="${idx}" />
                `;

                const sidebarInput = row.querySelector('.wp-label-input');
                const noteInput = row.querySelector('.wp-note-input');
                const delBtn = row.querySelector('.wp-del-btn');

                sidebarInput.addEventListener('input', (e) => {
                    const val = e.target.value;
                    currentWaypoints[idx].label = val;
                    const marker = waypointMarkers[idx];
                    if (marker && marker.getElement()) {
                        const mapInput = marker.getElement().querySelector('.waypoint-map-input');
                        if (mapInput) {
                            mapInput.value = val;
                            mapInput.style.width = measureInputWidth(val, `Point ${idx + 1}`);
                        }
                    }
                });

                noteInput.addEventListener('input', (e) => {
                    currentWaypoints[idx].note = e.target.value;
                });

                delBtn.addEventListener('click', () => {
                    removeWaypointAtIndex(idx);
                });

                list.appendChild(row);
            });
        }

        function renderSidebarTextBoxList() {
            const section = document.getElementById('active-textboxes-section');
            const list = document.getElementById('textbox-editor-list');
            if (!section || !list) return;

            if (currentTextBoxes.length === 0) {
                section.style.display = 'none';
                list.innerHTML = '';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = '';

            currentTextBoxes.forEach((tb, idx) => {
                const row = document.createElement('div');
                row.className = 'wp-row';
                row.innerHTML = `
                    <div class="tb-row-actions">
                        <span class="tb-badge-num">Note ${idx + 1}</span>
                        <div style="display:flex; gap:4px; align-items:center;">
                            <button type="button" class="secondary tb-locate-btn" title="Center map on this text box">Locate</button>
                            <button type="button" class="wp-del-btn" title="Remove text box">✕</button>
                        </div>
                    </div>
                    <textarea class="tb-sidebar-input" data-tb-idx="${idx}" placeholder="Type map note...">${escapeHtml(tb.text || '')}</textarea>
                `;

                const sidebarTextarea = row.querySelector('.tb-sidebar-input');
                const locateBtn = row.querySelector('.tb-locate-btn');
                const delBtn = row.querySelector('.wp-del-btn');

                sidebarTextarea.addEventListener('input', (e) => {
                    const val = e.target.value;
                    currentTextBoxes[idx].text = val;
                    const marker = textBoxMarkers[idx];
                    if (marker && marker.getElement()) {
                        const mapTextarea = marker.getElement().querySelector('.map-textbox-input');
                        if (mapTextarea) {
                            mapTextarea.value = val;
                            autoResizeTextarea(mapTextarea);
                        }
                    }
                });

                locateBtn.addEventListener('click', () => {
                    map.panTo(L.latLng(tb.lat, tb.lng));
                    const marker = textBoxMarkers[idx];
                    if (marker && marker.getElement()) {
                        const mapTextarea = marker.getElement().querySelector('.map-textbox-input');
                        if (mapTextarea) mapTextarea.focus();
                    }
                });

                delBtn.addEventListener('click', () => {
                    removeTextBoxAtIndex(idx);
                });

                list.appendChild(row);
            });
        }

        function addMarkerForPoint(wp, index) {
            const latlng = L.latLng(wp.lat, wp.lng);
            const icon = createIconForWaypoint(wp, index);
            const marker = L.marker(latlng, { draggable: true, icon }).addTo(map);

            marker.on('add', () => {
                const el = marker.getElement();
                if (!el) return;
                L.DomEvent.disableClickPropagation(el);
                L.DomEvent.disableScrollPropagation(el);

                const mapInput = el.querySelector('.waypoint-map-input');
                const mapDelBtn = el.querySelector('.wp-map-del');

                if (mapInput) {
                    stopMarkerEventPropagation(mapInput);
                    mapInput.addEventListener('focus', () => {
                        if (marker.dragging) marker.dragging.disable();
                    });
                    mapInput.addEventListener('blur', () => {
                        if (marker.dragging) marker.dragging.enable();
                    });
                    mapInput.addEventListener('input', (e) => {
                        const idx = waypointMarkers.indexOf(marker);
                        if (idx === -1) return;
                        const val = e.target.value;
                        currentWaypoints[idx].label = val;
                        mapInput.style.width = measureInputWidth(val, `Point ${idx + 1}`);
                        const sidebarInput = document.querySelector(`.wp-label-input[data-wp-idx="${idx}"]`);
                        if (sidebarInput) sidebarInput.value = val;
                    });
                }

                if (mapDelBtn) {
                    stopMarkerEventPropagation(mapDelBtn);
                    mapDelBtn.addEventListener('click', () => {
                        const idx = waypointMarkers.indexOf(marker);
                        if (idx !== -1) removeWaypointAtIndex(idx);
                    });
                }
            });

            marker.on('dragend', () => {
                const pos = marker.getLatLng();
                const idx = waypointMarkers.indexOf(marker);
                if (idx !== -1) {
                    currentWaypoints[idx].lat = pos.lat;
                    currentWaypoints[idx].lng = pos.lng;
                    updateRoutingWaypoints();
                }
            });

            waypointMarkers.push(marker);
            return marker;
        }

        function addMarkerForTextBox(tb, focusNew) {
            const latlng = L.latLng(tb.lat, tb.lng);
            const icon = createIconForTextBox(tb);
            const marker = L.marker(latlng, { draggable: true, icon }).addTo(map);

            marker.on('add', () => {
                const el = marker.getElement();
                if (!el) return;
                L.DomEvent.disableClickPropagation(el);
                L.DomEvent.disableScrollPropagation(el);

                const mapTextarea = el.querySelector('.map-textbox-input');
                const mapDelBtn = el.querySelector('.map-textbox-del');

                if (mapTextarea) {
                    autoResizeTextarea(mapTextarea);
                    stopMarkerEventPropagation(mapTextarea);
                    mapTextarea.addEventListener('focus', () => {
                        if (marker.dragging) marker.dragging.disable();
                    });
                    mapTextarea.addEventListener('blur', () => {
                        if (marker.dragging) marker.dragging.enable();
                    });
                    mapTextarea.addEventListener('input', (e) => {
                        const idx = textBoxMarkers.indexOf(marker);
                        if (idx === -1) return;
                        const val = e.target.value;
                        currentTextBoxes[idx].text = val;
                        autoResizeTextarea(mapTextarea);
                        const sidebarInput = document.querySelector(`.tb-sidebar-input[data-tb-idx="${idx}"]`);
                        if (sidebarInput) sidebarInput.value = val;
                    });
                    if (focusNew) {
                        setTimeout(() => mapTextarea.focus(), 30);
                    }
                }

                if (mapDelBtn) {
                    stopMarkerEventPropagation(mapDelBtn);
                    mapDelBtn.addEventListener('click', () => {
                        const idx = textBoxMarkers.indexOf(marker);
                        if (idx !== -1) removeTextBoxAtIndex(idx);
                    });
                }
            });

            marker.on('dragend', () => {
                const pos = marker.getLatLng();
                const idx = textBoxMarkers.indexOf(marker);
                if (idx !== -1) {
                    currentTextBoxes[idx].lat = pos.lat;
                    currentTextBoxes[idx].lng = pos.lng;
                }
            });

            textBoxMarkers.push(marker);
            return marker;
        }

        function clearMarkers() {
            waypointMarkers.forEach(m => {
                try { map.removeLayer(m); } catch (e) {}
            });
            waypointMarkers = [];
        }

        function clearTextBoxMarkers() {
            textBoxMarkers.forEach(m => {
                try { map.removeLayer(m); } catch (e) {}
            });
            textBoxMarkers = [];
        }

        function syncMarkersToWaypoints() {
            clearMarkers();
            currentWaypoints.forEach((wp, idx) => addMarkerForPoint(wp, idx));
            renderSidebarWaypointList();
        }

        function syncTextBoxMarkers(focusLast) {
            clearTextBoxMarkers();
            currentTextBoxes.forEach((tb, idx) => {
                const shouldFocus = Boolean(focusLast && idx === currentTextBoxes.length - 1);
                addMarkerForTextBox(tb, shouldFocus);
            });
            renderSidebarTextBoxList();
        }

        function addWaypoint(latlng) {
            initRouting();
            let defaultLabel = '';
            if (currentWaypoints.length === 0) defaultLabel = 'Start';
            else if (currentWaypoints.length === 1) defaultLabel = 'Finish';

            currentWaypoints.push({ lat: latlng.lat, lng: latlng.lng, label: defaultLabel, note: '' });
            syncMarkersToWaypoints();
            updateRoutingWaypoints();
        }

        function addTextBox(latlng) {
            currentTextBoxes.push({
                id: 'tb_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                lat: latlng.lat,
                lng: latlng.lng,
                text: ''
            });
            syncTextBoxMarkers(true);
            setTextBoxPlacementMode(false);
        }

        function saveCurrentRoute() {
            const nameInput = document.getElementById('route-name');
            const notesInput = document.getElementById('route-notes');
            const name = nameInput ? nameInput.value.trim() : '';
            const notes = notesInput ? notesInput.value.trim() : '';

            if (!name) {
                showToast('Please enter a route name.');
                if (nameInput) nameInput.focus();
                return;
            }

            if (!Array.isArray(currentWaypoints) || currentWaypoints.length < 2) {
                showToast('Add at least two waypoints on the map before saving.');
                return;
            }

            const routeData = {
                id: 'route_' + Date.now(),
                name: name,
                notes: notes,
                waypoints: currentWaypoints.map(wp => ({
                    lat: Number(wp.lat),
                    lng: Number(wp.lng),
                    label: wp.label || '',
                    note: wp.note || ''
                })),
                textBoxes: currentTextBoxes.map(tb => ({
                    id: tb.id,
                    lat: Number(tb.lat),
                    lng: Number(tb.lng),
                    text: tb.text || ''
                })),
                geometry: currentRouteGeometry && currentRouteGeometry.length > 0
                    ? currentRouteGeometry
                    : currentWaypoints.map(wp => ({ lat: Number(wp.lat), lng: Number(wp.lng) })),
                createdAt: new Date().toISOString()
            };

            const existing = getSavedDrives();
            existing.push(routeData);
            setSavedDrives(existing);

            clearCurrentMap();
            loadSavedRoutes();
            showToast(`Saved "${name}"`);
        }

        function loadSavedRoutes() {
            const listContainer = document.getElementById('route-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            const routes = getSavedDrives();

            if (routes.length === 0) {
                listContainer.innerHTML = '<p class="hint">No saved routes yet.</p>';
                return;
            }

            routes.forEach(route => {
                const card = document.createElement('div');
                card.className = 'route-card';
                const tbCount = Array.isArray(route.textBoxes) ? route.textBoxes.length : 0;
                const summaryText = tbCount > 0
                    ? `${route.waypoints.length} Waypoints · ${tbCount} Text Box${tbCount === 1 ? '' : 'es'}`
                    : `${route.waypoints.length} Waypoints`;

                if (editingRouteId === route.id) {
                    card.innerHTML = `
                        <div class="route-edit-fields">
                            <input type="text" class="edit-route-name" value="${escapeHtml(route.name)}" placeholder="Route name..." />
                            <textarea class="edit-route-notes" placeholder="Route notes...">${escapeHtml(route.notes || '')}</textarea>
                        </div>
                        <div class="card-actions">
                            <button data-action="save-edit" data-id="${route.id}">Save</button>
                            <button class="secondary" data-action="cancel-edit" data-id="${route.id}">Cancel</button>
                        </div>
                    `;
                } else {
                    const notesHtml = route.notes
                        ? `<div class="route-card-notes">${escapeHtml(route.notes)}</div>`
                        : '';
                    card.innerHTML = `
                        <h3>${escapeHtml(route.name)}</h3>
                        <p>${summaryText}</p>
                        ${notesHtml}
                        <div class="card-actions">
                            <button class="secondary" data-action="view" data-id="${route.id}">View</button>
                            <button class="secondary" data-action="edit" data-id="${route.id}">Edit</button>
                            <button class="secondary" data-action="export" data-id="${route.id}">Export GPX</button>
                            <button class="danger" data-action="delete" data-id="${route.id}">Delete</button>
                        </div>
                    `;
                }
                listContainer.appendChild(card);
            });

            listContainer.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', function () {
                    const act = this.getAttribute('data-action');
                    const id = this.getAttribute('data-id');
                    if (act === 'view') displayRoute(id);
                    else if (act === 'edit') {
                        editingRouteId = id;
                        loadSavedRoutes();
                    }
                    else if (act === 'cancel-edit') {
                        editingRouteId = null;
                        loadSavedRoutes();
                    }
                    else if (act === 'save-edit') {
                        const card = this.closest('.route-card');
                        const newName = card.querySelector('.edit-route-name').value.trim();
                        const newNotes = card.querySelector('.edit-route-notes').value.trim();
                        if (!newName) {
                            showToast('Route name cannot be empty.');
                            return;
                        }
                        const allRoutes = getSavedDrives();
                        const target = allRoutes.find(r => r.id === id);
                        if (target) {
                            target.name = newName;
                            target.notes = newNotes;
                            setSavedDrives(allRoutes);
                        }
                        editingRouteId = null;
                        loadSavedRoutes();
                        showToast('Route details updated.');
                    }
                    else if (act === 'export') exportGPX(id);
                    else if (act === 'delete') deleteRoute(id);
                });
            });
        }

        function displayRoute(id) {
            const routes = getSavedDrives();
            const route = routes.find(r => r.id === id);
            if (!route) return;

            clearCurrentMap();

            const nameInput = document.getElementById('route-name');
            const notesInput = document.getElementById('route-notes');
            if (nameInput) nameInput.value = route.name || '';
            if (notesInput) notesInput.value = route.notes || '';

            currentWaypoints = (route.waypoints || []).map(w => ({
                lat: w.lat,
                lng: w.lng,
                label: w.label || '',
                note: w.note || ''
            }));
            currentTextBoxes = (route.textBoxes || []).map((tb, idx) => ({
                id: tb.id || ('tb_' + Date.now() + '_' + idx),
                lat: tb.lat,
                lng: tb.lng,
                text: tb.text || ''
            }));
            currentRouteGeometry = route.geometry || [];

            syncMarkersToWaypoints();
            syncTextBoxMarkers(false);

            if (!routingControl) initRouting();
            updateRoutingWaypoints();

            const allCoords = [
                ...currentWaypoints.map(w => L.latLng(w.lat, w.lng)),
                ...currentTextBoxes.map(tb => L.latLng(tb.lat, tb.lng))
            ];
            if (allCoords.length > 0) {
                map.fitBounds(L.latLngBounds(allCoords), { padding: [50, 50] });
            }
        }

        function deleteRoute(id) {
            let routes = getSavedDrives();
            routes = routes.filter(r => r.id !== id);
            setSavedDrives(routes);
            if (editingRouteId === id) editingRouteId = null;
            loadSavedRoutes();
            clearCurrentMap();
            showToast('Route deleted.');
        }

        function exportGPX(id) {
            const routes = getSavedDrives();
            const route = routes.find(r => r.id === id);
            if (!route) return;

            const pointsToExport = (route.geometry && route.geometry.length > 0)
                ? route.geometry
                : route.waypoints;

            let gpxContent = '<?xml version="1.0" encoding="UTF-8"?>\n';
            gpxContent += '<gpx version="1.1" creator="RouteCraft" xmlns="http://www.topografix.com/GPX/1/1">\n';

            route.waypoints.forEach((pt, index) => {
                const wptName = pt.label ? pt.label : `Waypoint ${index + 1}`;
                gpxContent += `  <wpt lat="${pt.lat}" lon="${pt.lng}">\n    <name>${escapeHtml(wptName)}</name>\n`;
                if (pt.note) {
                    gpxContent += `    <desc>${escapeHtml(pt.note)}</desc>\n`;
                }
                gpxContent += '  </wpt>\n';
            });

            if (Array.isArray(route.textBoxes)) {
                route.textBoxes.forEach((tb, index) => {
                    gpxContent += `  <wpt lat="${tb.lat}" lon="${tb.lng}">\n`;
                    gpxContent += `    <name>Note ${index + 1}</name>\n`;
                    gpxContent += `    <desc>${escapeHtml(tb.text || '')}</desc>\n`;
                    gpxContent += '    <type>routecraft-textbox</type>\n';
                    gpxContent += '  </wpt>\n';
                });
            }

            gpxContent += `  <trk>\n    <name>${escapeHtml(route.name)}</name>\n`;
            if (route.notes) {
                gpxContent += `    <desc>${escapeHtml(route.notes)}</desc>\n`;
            }
            gpxContent += '    <trkseg>\n';
            pointsToExport.forEach(pt => {
                gpxContent += `      <trkpt lat="${pt.lat}" lon="${pt.lng}"></trkpt>\n`;
            });
            gpxContent += '    </trkseg>\n  </trk>\n</gpx>';

            const blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${route.name.toLowerCase().replace(/\s+/g, '_')}.gpx`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function handleGPXImport(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, 'text/xml');

                const wpts = xmlDoc.querySelectorAll('wpt');
                const trkpts = xmlDoc.querySelectorAll('trkpt, rtept');

                if ((!trkpts || trkpts.length === 0) && (!wpts || wpts.length === 0)) {
                    showToast('No valid waypoints or track points found in this GPX file.');
                    return;
                }

                const trkNameNode = xmlDoc.querySelector('trk > name') || xmlDoc.querySelector('metadata > name') || xmlDoc.querySelector('name');
                const trkDescNode = xmlDoc.querySelector('trk > desc');
                const defaultName = trkNameNode ? trkNameNode.textContent.trim() : file.name.replace(/\.[^/.]+$/, '');
                const defaultNotes = trkDescNode ? trkDescNode.textContent.trim() : '';

                let importedWaypoints = [];
                let importedTextBoxes = [];

                if (wpts && wpts.length > 0) {
                    Array.from(wpts).forEach((wpt, idx) => {
                        const lat = parseFloat(wpt.getAttribute('lat'));
                        const lng = parseFloat(wpt.getAttribute('lon'));
                        if (isNaN(lat) || isNaN(lng)) return;

                        const typeEl = wpt.querySelector('type');
                        const nameEl = wpt.querySelector('name');
                        const descEl = wpt.querySelector('desc');

                        if (typeEl && typeEl.textContent.trim() === 'routecraft-textbox') {
                            importedTextBoxes.push({
                                id: 'tb_' + Date.now() + '_' + idx,
                                lat,
                                lng,
                                text: descEl ? descEl.textContent.trim() : (nameEl ? nameEl.textContent.trim() : '')
                            });
                        } else {
                            importedWaypoints.push({
                                lat,
                                lng,
                                label: nameEl ? nameEl.textContent.trim() : '',
                                note: descEl ? descEl.textContent.trim() : ''
                            });
                        }
                    });
                }

                if (importedWaypoints.length < 2 && trkpts && trkpts.length > 0) {
                    let pts = Array.from(trkpts).map(pt => ({
                        lat: parseFloat(pt.getAttribute('lat')),
                        lng: parseFloat(pt.getAttribute('lon'))
                    })).filter(pt => !isNaN(pt.lat) && !isNaN(pt.lng));

                    if (pts.length > 20) {
                        const step = Math.ceil(pts.length / 15);
                        pts = pts.filter((_, idx) => idx % step === 0 || idx === pts.length - 1);
                    }
                    importedWaypoints = pts.map((p, idx) => ({
                        lat: p.lat,
                        lng: p.lng,
                        label: idx === 0 ? 'Start' : (idx === pts.length - 1 ? 'Finish' : ''),
                        note: ''
                    }));
                }

                clearCurrentMap();
                document.getElementById('route-name').value = defaultName;
                document.getElementById('route-notes').value = defaultNotes;
                currentWaypoints = importedWaypoints;
                currentTextBoxes = importedTextBoxes;

                if (!routingControl) initRouting();
                updateRoutingWaypoints();
                syncMarkersToWaypoints();
                syncTextBoxMarkers(false);

                const allCoords = [
                    ...currentWaypoints.map(w => L.latLng(w.lat, w.lng)),
                    ...currentTextBoxes.map(tb => L.latLng(tb.lat, tb.lng))
                ];
                if (allCoords.length > 0) {
                    map.fitBounds(L.latLngBounds(allCoords), { padding: [50, 50] });
                }
                showToast(`Imported "${defaultName}"`);
            };
            reader.readAsText(file);
        }

        function clearCurrentMap() {
            currentWaypoints = [];
            currentTextBoxes = [];
            currentRouteGeometry = [];
            setTextBoxPlacementMode(false);

            const nameInput = document.getElementById('route-name');
            const notesInput = document.getElementById('route-notes');
            if (nameInput) nameInput.value = '';
            if (notesInput) notesInput.value = '';

            if (routingControl) routingControl.setWaypoints([]);
            clearMarkers();
            clearTextBoxMarkers();
            renderSidebarWaypointList();
            renderSidebarTextBoxList();

            map.eachLayer(function(layer) {
                if (layer instanceof L.Polyline && !(layer instanceof L.TileLayer)) {
                    try { map.removeLayer(layer); } catch (e) {}
                }
            });
        }

        function toggleSidebar() {
            const collapsed = document.body.classList.toggle('sidebar-collapsed');
            document.getElementById('sidebar').setAttribute('aria-hidden', String(collapsed));
            setTimeout(() => {
                try { map.invalidateSize(); } catch (e) {}
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', () => {
            map = L.map('map').setView([52.052, -3.581], 9);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            initRouting();
            loadSavedRoutes();

            map.on('click', function(e) {
                if (isPlacingTextBox) {
                    addTextBox(e.latlng);
                } else {
                    addWaypoint(e.latlng);
                }
            });

            document.getElementById('save-btn').addEventListener('click', saveCurrentRoute);
            document.getElementById('clear-btn').addEventListener('click', clearCurrentMap);
            document.getElementById('add-textbox-btn').addEventListener('click', () => {
                setTextBoxPlacementMode(!isPlacingTextBox);
            });

            const fileInput = document.getElementById('gpx-file-input');
            document.getElementById('import-btn').addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                handleGPXImport(e.target.files[0]);
                e.target.value = '';
            });

            document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
            document.getElementById('floating-menu-btn').addEventListener('click', toggleSidebar);

            setTimeout(() => {
                try { map.invalidateSize(); } catch (e) {}
            }, 250);

            window.addEventListener('resize', () => {
                try { map.invalidateSize(); } catch (e) {}
            });
            window.addEventListener('orientationchange', () => {
                try { map.invalidateSize(); } catch (e) {}
            });
        });
    </script>
</body>
</html>
