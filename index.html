        function latLngToOsgb(lat, lng) {
            const deg2rad = Math.PI / 180;
            const phi = lat * deg2rad;
            const lam = lng * deg2rad;

            // WGS84 ellipsoid -> ECEF
            const aW = 6378137.0;
            const bW = 6356752.3142;
            const e2W = (aW * aW - bW * bW) / (aW * aW);
            const sinP = Math.sin(phi);
            const cosP = Math.cos(phi);
            const nuW = aW / Math.sqrt(1 - e2W * sinP * sinP);
            const x1 = nuW * cosP * Math.cos(lam);
            const y1 = nuW * cosP * Math.sin(lam);
            const z1 = nuW * (1 - e2W) * sinP;

            // Helmert WGS84 -> OSGB36
            const tx = -446.448;
            const ty = 125.157;
            const tz = -542.060;
            const s = 20.4894e-6;
            const rx = (-0.1502 / 3600) * deg2rad;
            const ry = (-0.2470 / 3600) * deg2rad;
            const rz = (-0.8421 / 3600) * deg2rad;

            const x2 = tx + (1 + s) * x1 - rz * y1 + ry * z1;
            const y2 = ty + rz * x1 + (1 + s) * y1 - rx * z1;
            const z2 = tz - ry * x1 + rx * y1 + (1 + s) * z1;

            // Airy 1830 ellipsoid
            const a = 6377563.396;
            const b = 6356256.909;
            const e2 = (a * a - b * b) / (a * a);
            const p = Math.sqrt(x2 * x2 + y2 * y2);
            let phi2 = Math.atan2(z2, p * (1 - e2));
            for (let i = 0; i < 6; i++) {
                const sP = Math.sin(phi2);
                const nu2 = a / Math.sqrt(1 - e2 * sP * sP);
                phi2 = Math.atan2(z2 + e2 * nu2 * sP, p);
            }
            const lam2 = Math.atan2(y2, x2);

            // Transverse Mercator -> British National Grid
            const F0 = 0.9996012717;
            const phi0 = 49 * deg2rad;
            const lam0 = -2 * deg2rad;
            const N0 = -100000;
            const E0 = 400000;
            const n = (a - b) / (a + b);
            const n2 = n * n;
            const n3 = n * n * n;

            const cosLat = Math.cos(phi2);
            const sinLat = Math.sin(phi2);
            const nu = a * F0 / Math.sqrt(1 - e2 * sinLat * sinLat);
            const rho = a * F0 * (1 - e2) / Math.pow(1 - e2 * sinLat * sinLat, 1.5);
            const eta2 = nu / rho - 1;

            const Ma = (1 + n + (5 / 4) * n2 + (5 / 4) * n3) * (phi2 - phi0);
            const Mb = (3 * n + 3 * n2 + (21 / 8) * n3) * Math.sin(phi2 - phi0) * Math.cos(phi2 + phi0);
            const Mc = ((15 / 8) * n2 + (15 / 8) * n3) * Math.sin(2 * (phi2 - phi0)) * Math.cos(2 * (phi2 + phi0));
            const Md = (35 / 24) * n3 * Math.sin(3 * (phi2 - phi0)) * Math.cos(3 * (phi2 + phi0));
            const M = b * F0 * (Ma - Mb + Mc - Md);

            const cos3 = cosLat * cosLat * cosLat;
            const cos5 = cos3 * cosLat * cosLat;
            const tanLat = Math.tan(phi2);
            const tan2 = tanLat * tanLat;
            const tan4 = tan2 * tan2;

            const I = M + N0;
            const II = (nu / 2) * sinLat * cosLat;
            const III = (nu / 24) * sinLat * cos3 * (5 - tan2 + 9 * eta2);
            const IIIA = (nu / 720) * sinLat * cos5 * (61 - 58 * tan2 + tan4);
            const IV = nu * cosLat;
            const V = (nu / 6) * cos3 * (nu / rho - tan2);
            const VI = (nu / 120) * cos5 * (5 - 18 * tan2 + tan4 + 14 * eta2 - 58 * tan2 * eta2);

            const dLam = lam2 - lam0;
            const dLam2 = dLam * dLam;
            const northing = I + II * dLam2 + III * dLam2 * dLam2 + IIIA * dLam2 * dLam2 * dLam2;
            const easting = E0 + IV * dLam + V * dLam * dLam2 + VI * dLam * dLam2 * dLam2;

            return { easting, northing };
        }

        function formatOsgbSquareLetters(easting, northing) {
            if (easting < 0 || northing < 0) return '';
            const e100 = Math.floor(easting / 100000);
            const n100 = Math.floor(northing / 100000);
            const eIdx = e100 + 10;
            const nIdx = n100 + 5;
            const l1 = (19 - Math.floor(nIdx / 5)) * 5 + Math.floor(eIdx / 5);
            const l2 = (4 - (nIdx % 5)) * 5 + (eIdx % 5);
            if (l1 < 0 || l1 > 24 || l2 < 0 || l2 > 24) return '';
            const alpha = 'ABCDEFGHJKLMNOPQRSTUVWXYZ'; // 25 letters without 'I'
            return alpha[l1] + alpha[l2];
        }

        function createOsgbGridLayer() {
            const OsgbLayer = L.GridLayer.extend({
                createTile: function(coords) {
                    const tile = document.createElement('canvas');
                    const size = this.getTileSize();
                    tile.width = size.x;
                    tile.height = size.y;
                    if (coords.z < 10) return tile;

                    const nwPoint = coords.scaleBy(size);
                    const nwLatLng = map.unproject(nwPoint, coords.z);
                    const neLatLng = map.unproject(nwPoint.add([size.x, 0]), coords.z);
                    const swLatLng = map.unproject(nwPoint.add([0, size.y]), coords.z);

                    // Draw British National Grid lines only across Great Britain
                    if (nwLatLng.lat < 49.4 || swLatLng.lat > 61.5 || neLatLng.lng < -9.0 || nwLatLng.lng > 2.5) {
                        return tile;
                    }

                    const o00 = latLngToOsgb(nwLatLng.lat, nwLatLng.lng);
                    const o10 = latLngToOsgb(neLatLng.lat, neLatLng.lng);
                    const o01 = latLngToOsgb(swLatLng.lat, swLatLng.lng);

                    // Local linear mapping from pixel (px, py) to OSGB (E, N)
                    const a11 = (o10.easting - o00.easting) / size.x;
                    const a12 = (o01.easting - o00.easting) / size.y;
                    const a21 = (o10.northing - o00.northing) / size.x;
                    const a22 = (o01.northing - o00.northing) / size.y;
                    const det = a11 * a22 - a12 * a21;
                    if (Math.abs(det) < 1e-6) return tile;

                    // Inverse matrix mapping (dE, dN) -> (px, py)
                    const b11 = a22 / det;
                    const b12 = -a12 / det;
                    const b21 = -a21 / det;
                    const b22 = a11 / det;
                    const toPx = (e, n) => ({
                        x: b11 * (e - o00.easting) + b12 * (n - o00.northing),
                        y: b21 * (e - o00.easting) + b22 * (n - o00.northing)
                    });

                    const o11 = latLngToOsgb(
                        map.unproject(nwPoint.add([size.x, size.y]), coords.z).lat,
                        map.unproject(nwPoint.add([size.x, size.y]), coords.z).lng
                    );

                    const minE = Math.min(o00.easting, o10.easting, o01.easting, o11.easting);
                    const maxE = Math.max(o00.easting, o10.easting, o01.easting, o11.easting);
                    const minN = Math.min(o00.northing, o10.northing, o01.northing, o11.northing);
                    const maxN = Math.max(o00.northing, o10.northing, o01.northing, o11.northing);

                    const step = coords.z >= 12 ? 1000 : 10000;
                    const startE = Math.floor(minE / step) * step;
                    const startN = Math.floor(minN / step) * step;

                    const ctx = tile.getContext('2d');
                    const useDarkGrid = isDarkMode || activeMapStyle === 'dark';
                    ctx.strokeStyle = useDarkGrid
                        ? (coords.z >= 12 ? 'rgba(56, 189, 248, 0.42)' : 'rgba(56, 189, 248, 0.34)')
                        : (coords.z >= 12 ? 'rgba(0, 118, 192, 0.36)' : 'rgba(0, 118, 192, 0.30)');
                    ctx.lineWidth = 1;
                    ctx.font = '700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                    ctx.fillStyle = useDarkGrid ? 'rgba(125, 211, 252, 0.86)' : 'rgba(0, 102, 168, 0.78)';

                    for (let e = startE; e <= maxE + step; e += step) {
                        const pTop = toPx(e, minN - step);
                        const pBot = toPx(e, maxN + step);
                        const isMajor = (e % 10000 === 0);
                        ctx.lineWidth = isMajor ? 1.4 : 0.9;
                        ctx.beginPath();
                        ctx.moveTo(pTop.x, pTop.y);
                        ctx.lineTo(pBot.x, pBot.y);
                        ctx.stroke();

                        const labelDigits = String(Math.floor(((e % 100000) + 100000) % 100000 / 1000)).padStart(2, '0');
                        const midP = toPx(e, (minN + maxN) / 2);
                        if (midP.x >= 4 && midP.x <= size.x - 18) {
                            ctx.fillText(labelDigits, midP.x + 3, 12);
                        }
                    }

                    for (let n = startN; n <= maxN + step; n += step) {
                        const pLeft = toPx(minE - step, n);
                        const pRight = toPx(maxE + step, n);
                        const isMajor = (n % 10000 === 0);
                        ctx.lineWidth = isMajor ? 1.4 : 0.9;
                        ctx.beginPath();
                        ctx.moveTo(pLeft.x, pLeft.y);
                        ctx.lineTo(pRight.x, pRight.y);
                        ctx.stroke();

                        const labelDigits = String(Math.floor(((n % 100000) + 100000) % 100000 / 1000)).padStart(2, '0');
                        const midP = toPx((minE + maxE) / 2, n);
                        if (midP.y >= 12 && midP.y <= size.y - 4) {
                            ctx.fillText(labelDigits, 4, midP.y - 3);
                        }
                    }

                    // Show 2-letter 100km OS square code subtly inside major grid intersections
                    if (coords.z >= 12) {
                        for (let e = startE; e <= maxE; e += step * 2) {
                            for (let n = startN; n <= maxN; n += step * 2) {
                                const sq = formatOsgbSquareLetters(e + 10, n + 10);
                                if (!sq) continue;
                                const pt = toPx(e, n);
                                if (pt.x > 6 && pt.x < size.x - 24 && pt.y > 16 && pt.y < size.y - 6) {
                                    const e2 = String(Math.floor((e % 100000) / 1000)).padStart(2, '0');
                                    const n2 = String(Math.floor((n % 100000) / 1000)).padStart(2, '0');
                                    const useDarkSq = isDarkMode || activeMapStyle === 'dark';
                                    ctx.fillStyle = useDarkSq ? 'rgba(125, 211, 252, 0.68)' : 'rgba(0, 102, 168, 0.55)';
                                    ctx.fillText(`${sq}${e2}${n2}`, pt.x + 3, pt.y - 3);
                                }
                            }
                        }
                    }

                    return tile;
                }
            });
            return new OsgbLayer({ zIndex: 350, opacity: 1 });
        }

        function setMapStyle(styleKey) {
            if (!map || !baseTileLayers[styleKey]) return;
            activeMapStyle = styleKey;
            if (styleKey !== 'dark') {
                lastLightMapStyle = styleKey;
            }
            Object.entries(baseTileLayers).forEach(([key, layer]) => {
                if (key === styleKey) {
                    if (!map.hasLayer(layer)) layer.addTo(map);
                } else {
                    if (map.hasLayer(layer)) map.removeLayer(layer);
                }
            });
            const select = document.getElementById('map-style-select');
            if (select && select.value !== styleKey) {
                select.value = styleKey;
            }
            if (osgbGridLayer && typeof osgbGridLayer.redraw === 'function') {
                osgbGridLayer.redraw();
            }
        }

        function setThemeMode(mode, options) {
            const opts = options || {};
            isDarkMode = (mode === 'dark');
            document.body.classList.toggle('dark-mode', isDarkMode);

            const themeBtn = document.getElementById('theme-toggle-btn');
            if (themeBtn) {
                themeBtn.textContent = isDarkMode ? '☀️ Light' : '🌙 Dark';
                themeBtn.title = isDarkMode ? 'Switch to light mode' : 'Switch to dark mode';
                themeBtn.setAttribute('aria-pressed', String(isDarkMode));
            }

            if (!opts.skipPersist) {
                try {
                    localStorage.setItem(THEME_STORAGE_KEY, isDarkMode ? 'dark' : 'light');
                } catch (e) {}
            }

            if (!opts.skipMapTileSwitch) {
                if (isDarkMode) {
                    if (activeMapStyle !== 'dark') {
                        lastLightMapStyle = activeMapStyle;
                        setMapStyle('dark');
                    }
                } else if (activeMapStyle === 'dark') {
                    setMapStyle(lastLightMapStyle || 'landranger');
                }
            }

            if (osgbGridLayer && typeof osgbGridLayer.redraw === 'function') {
                osgbGridLayer.redraw();
            }
            if (elevationProfileData.length >= 2) {
                renderElevationChart();
            }
        }

        function setOsGridVisible(visible) {
            isOsGridEnabled = Boolean(visible);
            if (osgbGridLayer && map) {
                if (isOsGridEnabled && !map.hasLayer(osgbGridLayer)) {
                    osgbGridLayer.addTo(map);
                } else if (!isOsGridEnabled && map.hasLayer(osgbGridLayer)) {
                    map.removeLayer(osgbGridLayer);
                }
            }
            const toggle = document.getElementById('os-grid-toggle');
            if (toggle) toggle.checked = isOsGridEnabled;
        }

        function resampleRouteForElevation(points, targetSamples) {
            if (!Array.isArray(points) || points.length < 2) return [];
            const cumDists = [0];
            for (let i = 1; i < points.length; i++) {
                const prev = L.latLng(points[i - 1].lat, points[i - 1].lng);
                const curr = L.latLng(points[i].lat, points[i].lng);
                cumDists.push(cumDists[i - 1] + prev.distanceTo(curr));
            }
            const totalDist = cumDists[cumDists.length - 1];
            if (totalDist <= 0) {
                return [
                    { lat: Number(points[0].lat), lng: Number(points[0].lng), distMeters: 0 },
                    { lat: Number(points[points.length - 1].lat), lng: Number(points[points.length - 1].lng), distMeters: 0 }
                ];
            }

            const count = Math.min(targetSamples, Math.max(12, Math.round(totalDist / 180) + 12));
            const samples = [];
            let segIdx = 0;

            for (let i = 0; i < count; i++) {
                const d = (i / (count - 1)) * totalDist;
                while (segIdx < cumDists.length - 2 && cumDists[segIdx + 1] < d) {
                    segIdx++;
                }
                const segStartDist = cumDists[segIdx];
                const segEndDist = cumDists[segIdx + 1];
                const segLen = segEndDist - segStartDist;
                const t = segLen > 0 ? Math.max(0, Math.min(1, (d - segStartDist) / segLen)) : 0;
                const pA = points[segIdx];
                const pB = points[segIdx + 1];
                samples.push({
                    lat: Number(pA.lat) + (Number(pB.lat) - Number(pA.lat)) * t,
                    lng: Number(pA.lng) + (Number(pB.lng) - Number(pA.lng)) * t,
                    distMeters: d
                });
            }
            return samples;
        }

        function computeWaypointChartDistances(routePoints, waypoints) {
            if (!Array.isArray(routePoints) || routePoints.length < 2 || !Array.isArray(waypoints)) return [];
            const cumDists = [0];
            for (let i = 1; i < routePoints.length; i++) {
                cumDists.push(
                    cumDists[i - 1] + L.latLng(routePoints[i - 1].lat, routePoints[i - 1].lng)
                        .distanceTo(L.latLng(routePoints[i].lat, routePoints[i].lng))
                );
            }
            let searchStart = 0;
            return waypoints.map((wp, idx) => {
                if (idx === 0) return { label: String(idx + 1), distKm: 0 };
                if (idx === waypoints.length - 1) return { label: String(idx + 1), distKm: cumDists[cumDists.length - 1] / 1000 };
                const wpLl = L.latLng(wp.lat, wp.lng);
                let bestIdx = searchStart;
                let bestDist = Infinity;
                for (let j = searchStart; j < routePoints.length; j++) {
                    const d = wpLl.distanceTo(L.latLng(routePoints[j].lat, routePoints[j].lng));
                    if (d < bestDist) {
                        bestDist = d;
                        bestIdx = j;
                    }
                }
                searchStart = bestIdx;
                return { label: String(idx + 1), distKm: cumDists[bestIdx] / 1000 };
            });
        }

        async function fetchElevationsForSamples(samples) {
            const missingIndices = [];
            const results = new Array(samples.length).fill(null);

            samples.forEach((pt, idx) => {
                const key = `${pt.lat.toFixed(4)},${pt.lng.toFixed(4)}`;
                if (elevationPointCache.has(key)) {
                    results[idx] = elevationPointCache.get(key);
                } else {
                    missingIndices.push(idx);
                }
            });

            if (missingIndices.length === 0) return results;

            const lats = missingIndices.map(i => samples[i].lat.toFixed(5)).join(',');
            const lngs = missingIndices.map(i => samples[i].lng.toFixed(5)).join(',');

            try {
                const res = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lngs}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.elevation) && data.elevation.length === missingIndices.length) {
                        missingIndices.forEach((sampleIdx, k) => {
                            const val = Number(data.elevation[k]);
                            if (!isNaN(val)) {
                                results[sampleIdx] = val;
                                const key = `${samples[sampleIdx].lat.toFixed(4)},${samples[sampleIdx].lng.toFixed(4)}`;
                                elevationPointCache.set(key, val);
                            }
                        });
                        return results;
                    }
                }
            } catch (e) {}

            // Fallback to Open-Elevation
            try {
                const locations = missingIndices.map(i => ({ latitude: samples[i].lat, longitude: samples[i].lng }));
                const res = await fetch('https://api.open-elevation.com/api/v1/lookup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ locations })
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.results) && data.results.length === missingIndices.length) {
                        missingIndices.forEach((sampleIdx, k) => {
                            const val = Number(data.results[k].elevation);
                            if (!isNaN(val)) {
                                results[sampleIdx] = val;
                                const key = `${samples[sampleIdx].lat.toFixed(4)},${samples[sampleIdx].lng.toFixed(4)}`;
                                elevationPointCache.set(key, val);
                            }
                        });
                        return results;
                    }
                }
            } catch (e) {}

            return null;
        }

        function getInclineColor(gradePct) {
            if (gradePct <= -6) return '#0284c7';
            if (gradePct <= -1.5) return '#38bdf8';
            if (gradePct < 3) return '#10b981';
            if (gradePct < 7) return '#f59e0b';
            if (gradePct < 12) return '#ea580c';
            return '#dc2626';
        }

        function clearElevationHoverMarker() {
            if (elevationHoverMarker && map) {

                elevationHoverMarker = null;

        function renderElevationChart() {
            const svgEl = document.getElementById('elevation-svg');
            const wrapEl = document.getElementById('elevation-chart-wrap');
            const tooltipEl = document.getElementById('elevation-tooltip');
            if (!svgEl || !wrapEl || !window.d3 || elevationProfileData.length < 2) return;

            const width = wrapEl.clientWidth;
            const height = wrapEl.clientHeight;
            if (width < 60 || height < 40) return;

            const margin = { top: 14, right: 16, bottom: 22, left: 42 };
            const innerW = Math.max(20, width - margin.left - margin.right);
            const innerH = Math.max(20, height - margin.top - margin.bottom);

            const svg = d3.select(svgEl);
            svg.selectAll('*').remove();
            svg.attr('viewBox', `0 0 ${width} ${height}`);

            const maxDistKm = elevationProfileData[elevationProfileData.length - 1].distKm || 0.01;
            const elevExtent = d3.extent(elevationProfileData, d => d.elev);
            const minElev = elevExtent[0];
            const maxElev = elevExtent[1];
            const elevPad = Math.max(12, (maxElev - minElev) * 0.14);

            const xScale = d3.scaleLinear()
                .domain([0, maxDistKm])
                .range([0, innerW]);

            const yScale = d3.scaleLinear()
                .domain([Math.floor(minElev - elevPad), Math.ceil(maxElev + elevPad)])
                .range([innerH, 0]);

            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            // Horizontal elevation gridlines
            const gridStroke = isDarkMode ? '#1e293b' : '#e2e8f0';
            const axisStroke = isDarkMode ? '#475569' : '#cbd5e1';
            const axisTextColor = isDarkMode ? '#94a3b8' : '#64748b';
            const focusLineColor = isDarkMode ? '#f8fafc' : '#0f172a';
            const wpLineColor = isDarkMode ? '#94a3b8' : '#64748b';

            g.append('g')
                .attr('class', 'elev-grid')
                .call(d3.axisLeft(yScale).ticks(3).tickSize(-innerW).tickFormat(''))
                .call(sel => sel.select('.domain').remove())
                .call(sel => sel.selectAll('line')
                    .attr('stroke', gridStroke)
                    .attr('stroke-dasharray', '2,3'));

            // Soft baseline area fill
            const baseArea = d3.area()
                .x(d => xScale(d.distKm))
                .y0(innerH)
                .y1(d => yScale(d.elev))
                .curve(d3.curveMonotoneX);

            g.append('path')
                .datum(elevationProfileData)
                .attr('fill', isDarkMode ? 'rgba(148, 163, 184, 0.12)' : 'rgba(148, 163, 184, 0.14)')
                .attr('d', baseArea);

            // Incline-colored terrain segments (polygons + colored ridge line)
            for (let i = 1; i < elevationProfileData.length; i++) {
                const p0 = elevationProfileData[i - 1];
                const p1 = elevationProfileData[i];
                const segColor = getInclineColor(p1.gradePct);
                const x0 = xScale(p0.distKm);
                const x1 = xScale(p1.distKm);
                const y0 = yScale(p0.elev);
                const y1 = yScale(p1.elev);

                g.append('polygon')
                    .attr('points', `${x0},${innerH} ${x0},${y0} ${x1},${y1} ${x1},${innerH}`)
                    .attr('fill', segColor)
                    .attr('fill-opacity', isDarkMode ? 0.28 : 0.22);

                g.append('line')
                    .attr('x1', x0)
                    .attr('y1', y0)
                    .attr('x2', x1)
                    .attr('y2', y1)
                    .attr('stroke', segColor)
                    .attr('stroke-width', 2.4)
                    .attr('stroke-linecap', 'round');
            }

            // Waypoint vertical markers along route distance
            elevationWaypointMarks.forEach((wpMark) => {
                const wx = xScale(wpMark.distKm);
                g.append('line')
                    .attr('x1', wx)
                    .attr('y1', 0)
                    .attr('x2', wx)
                    .attr('y2', innerH)
                    .attr('stroke', wpLineColor)
                    .attr('stroke-width', 1)
                    .attr('stroke-dasharray', '3,3');

                g.append('circle')
                    .attr('cx', wx)
                    .attr('cy', 6)
                    .attr('r', 6.5)
                    .attr('fill', '#2b8ed6')
                    .attr('stroke', isDarkMode ? '#0f172a' : '#ffffff')
                    .attr('stroke-width', 1.2);

                g.append('text')
                    .attr('x', wx)
                    .attr('y', 9)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#ffffff')
                    .attr('font-size', '8px')
                    .attr('font-weight', '700')
                    .text(wpMark.label);
            });

            // Axes
            g.append('g')
                .call(d3.axisLeft(yScale).ticks(3).tickFormat(d => `${Math.round(d)}m`))
                .call(sel => sel.select('.domain').attr('stroke', axisStroke))
                .call(sel => sel.selectAll('text').attr('fill', axisTextColor).attr('font-size', '10px'));

            g.append('g')
                .attr('transform', `translate(0,${innerH})`)
                .call(d3.axisBottom(xScale).ticks(5).tickFormat(d => `${d.toFixed(1)} km`))
                .call(sel => sel.select('.domain').attr('stroke', axisStroke))
                .call(sel => sel.selectAll('text').attr('fill', axisTextColor).attr('font-size', '10px'));

            // Interactive Hover / Touch Scrubbing
            const focusLine = g.append('line')
                .attr('y1', 0)
                .attr('y2', innerH)
                .attr('stroke', focusLineColor)
                .attr('stroke-width', 1.2)
                .attr('stroke-dasharray', '3,2')
                .style('opacity', 0);

            const focusDot = g.append('circle')
                .attr('r', 4.5)
                .attr('fill', focusLineColor)
                .attr('stroke', isDarkMode ? '#0f172a' : '#ffffff')
                .attr('stroke-width', 1.5)
                .style('opacity', 0);

            const bisectDist = d3.bisector(d => d.distKm).center;

            const showAtPointer = (clientX) => {
                const rect = svgEl.getBoundingClientRect();
                const relX = clientX - rect.left - margin.left;
                const clampedX = Math.max(0, Math.min(innerW, relX));
                const targetDist = xScale.invert(clampedX);
                const idx = bisectDist(elevationProfileData, targetDist);
                const pt = elevationProfileData[idx];
                if (!pt) return;

                const px = xScale(pt.distKm);
                const py = yScale(pt.elev);
                const gradeSign = pt.gradePct > 0 ? '+' : '';
                const gradeColor = getInclineColor(pt.gradePct);

                focusLine.attr('x1', px).attr('x2', px).style('opacity', 1);
                focusDot.attr('cx', px).attr('cy', py).attr('fill', gradeColor).style('opacity', 1);

                if (tooltipEl) {
                    tooltipEl.textContent = `${Math.round(pt.elev)} m · ${gradeSign}${pt.gradePct.toFixed(1)}% · ${pt.distKm.toFixed(2)} km`;
                    tooltipEl.classList.add('visible');
                }

                if (map) {
                    if (!elevationHoverMarker) {
                        elevationHoverMarker = L.circleMarker([pt.lat, pt.lng], {
                            radius: 7,
                            color: '#ffffff',
                            weight: 2.5,
                            fillColor: gradeColor,
                            fillOpacity: 1,
                            interactive: false
                        }).addTo(map);
                    } else {
                        elevationHoverMarker.setLatLng([pt.lat, pt.lng]);
                        elevationHoverMarker.setStyle({ fillColor: gradeColor });
                    }
                }
            };

            const hidePointer = () => {
                focusLine.style('opacity', 0);
                focusDot.style('opacity', 0);
                if (tooltipEl) tooltipEl.classList.remove('visible');
                clearElevationHoverMarker();
            };

            g.append('rect')
                .attr('width', innerW)
                .attr('height', innerH)
                .attr('fill', 'transparent')
                .style('cursor', 'crosshair')
                .on('mousemove', (event) => showAtPointer(event.clientX))
                .on('mouseleave', hidePointer)
                .on('touchstart', (event) => {
                    if (event.touches && event.touches[0]) {
                        showAtPointer(event.touches[0].clientX);
                    }
                }, { passive: true })
                .on('touchmove', (event) => {
                    if (event.touches && event.touches[0]) {
                        showAtPointer(event.touches[0].clientX);
                    }
                }, { passive: true })
                .on('touchend', hidePointer);
        }

        async function refreshElevationProfile() {
            const panel = document.getElementById('elevation-panel');
            const statusEl = document.getElementById('elevation-status');
            const statsEl = document.getElementById('elevation-stats');
            const svgEl = document.getElementById('elevation-svg');
            if (!panel || !statusEl || !statsEl || !svgEl) return;

            const reqId = ++elevationRequestSeq;
            clearElevationHoverMarker();

            const sourcePoints = (currentRouteGeometry && currentRouteGeometry.length >= 2)
                ? currentRouteGeometry
                : currentWaypoints;

            if (!sourcePoints || sourcePoints.length < 2 || currentWaypoints.length < 2) {
                elevationProfileData = [];
                elevationWaypointMarks = [];
                panel.classList.add('is-empty');
                statusEl.textContent = 'Add 2+ waypoints to see terrain incline';
                statsEl.innerHTML = '';
                if (window.d3) d3.select(svgEl).selectAll('*').remove();
                setTimeout(() => { try { if (map) map.invalidateSize(); } catch (e) {} }, 220);
                return;
            }

            const wasEmpty = panel.classList.contains('is-empty');
            panel.classList.remove('is-empty');
            statusEl.textContent = 'Loading terrain elevation...';
            if (wasEmpty) {
                setTimeout(() => {
                    try { if (map) map.invalidateSize(); } catch (e) {}
                    if (!isElevationCollapsed && elevationProfileData.length >= 2) {
                        renderElevationChart();
                    }
                }, 220);
            }

            const samples = resampleRouteForElevation(sourcePoints, 75);
            const rawElevs = await fetchElevationsForSamples(samples);
            if (reqId !== elevationRequestSeq) return;

            if (!rawElevs || rawElevs.some(v => v === null || isNaN(v))) {
                elevationProfileData = [];
                statusEl.textContent = 'Elevation service unavailable';
                statsEl.innerHTML = '';
                if (window.d3) d3.select(svgEl).selectAll('*').remove();
                return;
            }

            // Light 3-point weighted smoothing to reduce 90m DEM stair-stepping while preserving peaks
            const smoothedElevs = rawElevs.map((val, idx) => {
                if (idx === 0 || idx === rawElevs.length - 1) return val;
                return rawElevs[idx - 1] * 0.22 + val * 0.56 + rawElevs[idx + 1] * 0.22;
            });

            let ascent = 0;
            let descent = 0;
            let maxGradePct = 0;
            let lastCountedElev = smoothedElevs[0];

            const profile = samples.map((pt, idx) => {
                const elev = smoothedElevs[idx];
                if (idx > 0) {
                    const delta = elev - lastCountedElev;
                    if (delta >= 1.5) {
                        ascent += delta;
                        lastCountedElev = elev;
                    } else if (delta <= -1.5) {
                        descent += Math.abs(delta);
                        lastCountedElev = elev;
                    }
                }

                let gradePct = 0;
                if (idx > 0) {
                    const winBack = Math.max(0, idx - 1);
                    const winFwd = Math.min(samples.length - 1, idx + 1);
                    const horiz = samples[winFwd].distMeters - samples[winBack].distMeters;
                    if (horiz > 8) {
                        gradePct = ((smoothedElevs[winFwd] - smoothedElevs[winBack]) / horiz) * 100;
                        gradePct = Math.max(-35, Math.min(35, gradePct));
                    }
                }
                if (Math.abs(gradePct) > Math.abs(maxGradePct)) {
                    maxGradePct = gradePct;
                }
                return {
                    lat: pt.lat,
                    lng: pt.lng,
                    distKm: pt.distMeters / 1000,
                    elev,
                    gradePct
                };
            });

            elevationProfileData = profile;
            elevationWaypointMarks = computeWaypointChartDistances(sourcePoints, currentWaypoints);

            const minE = Math.round(Math.min(...smoothedElevs));
            const maxE = Math.round(Math.max(...smoothedElevs));
            const maxClimb = Math.max(0, ...profile.map(p => p.gradePct));

            statusEl.textContent = '';
            statsEl.innerHTML = `
                <span class="incline-legend" aria-hidden="true">
                    <span class="incline-swatch"><span class="incline-dot" style="background:#10b981"></span>&lt;3%</span>
                    <span class="incline-swatch"><span class="incline-dot" style="background:#f59e0b"></span>3-7%</span>
                    <span class="incline-swatch"><span class="incline-dot" style="background:#ea580c"></span>7-12%</span>
                    <span class="incline-swatch"><span class="incline-dot" style="background:#dc2626"></span>12%+</span>
                </span>
                <span class="elev-stat-up" title="Total Ascent">+${Math.round(ascent)} m</span>
                <span class="elev-stat-down" title="Total Descent">-${Math.round(descent)} m</span>
                <span title="Elevation Range">${minE}–${maxE} m</span>
                <span class="elev-stat-grade" title="Max Uphill Gradient">Max ${maxClimb.toFixed(1)}%</span>
            `;

            renderElevationChart();
        }

            }

            const elevationWrap = document.getElementById('elevation-chart-wrap');
            if (elevationWrap && typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(() => {
                    if (elevationProfileData.length >= 2 && !isElevationCollapsed) {
                        renderElevationChart();
                    }
                });
                ro.observe(elevationWrap);
            }

            initRouting();
            loadSavedRoutes();
            const restoredDraft = restoreAutoSavedDraft();
            if (!restoredDraft) {
                updateRouteDistanceDisplay();
                recordHistoryState();
            }

            const routeNameInput = document.getElementById('route-name');
            const routeNotesInput = document.getElementById('route-notes');
            if (routeNameInput) {
                routeNameInput.addEventListener('input', () => scheduleAutoSave(550));
            }
            if (routeNotesInput) {
                routeNotesInput.addEventListener('input', () => scheduleAutoSave(550));
            }

            map.on('moveend zoomend', () => {
                if (!isRestoringAutoSave && hasWorkingRouteContent(buildWorkingDraftPayload())) {
                    scheduleAutoSave(1000);
                }
            });

            if (autoSaveIntervalId) clearInterval(autoSaveIntervalId);
            autoSaveIntervalId = setInterval(() => {
                saveWorkingDraftNow();
            }, AUTOSAVE_INTERVAL_MS);

            window.addEventListener('beforeunload', saveWorkingDraftNow);
            window.addEventListener('pagehide', saveWorkingDraftNow);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    saveWorkingDraftNow();
                }
            });

            map.on('click', function(e) {
                if (isDraggingMarker || Date.now() < suppressMapClickUntil) return;
                const origTarget = e.originalEvent && e.originalEvent.target;
                if (origTarget && origTarget.closest && origTarget.closest('.leaflet-marker-icon, .leaflet-control, .modal-backdrop')) {
                    return;
                }
                if (isPlacingTextBox) {
                    addTextBox(e.latlng);
                } else {
                    addWaypoint(e.latlng);
                }
            });

            document.getElementById('undo-btn').addEventListener('click', undoRouteChange);
            document.getElementById('redo-btn').addEventListener('click', redoRouteChange);
            document.getElementById('save-btn').addEventListener('click', saveCurrentRoute);
            document.getElementById('clear-btn').addEventListener('click', () => clearCurrentMap());
            document.getElementById('export-png-btn').addEventListener('click', exportRouteImage);
            document.getElementById('print-pdf-btn').addEventListener('click', printRouteDocument);
            document.getElementById('add-textbox-btn').addEventListener('click', () => {
                setTextBoxPlacementMode(!isPlacingTextBox);
            });

            document.addEventListener('keydown', (e) => {
                const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
                if (tag === 'input' || tag === 'textarea') return;
                if ((e.ctrlKey || e.metaKey) && !e.altKey) {
                    if (e.key.toLowerCase() === 'z' && !e.shiftKey) {
                        e.preventDefault();
                        undoRouteChange();
                    } else if ((e.key.toLowerCase() === 'z' && e.shiftKey) || e.key.toLowerCase() === 'y') {
                        e.preventDefault();
                        redoRouteChange();
                    }
                }
            });

            const pdfModal = document.getElementById('pdf-preview-modal');
            const pdfModalClose = document.getElementById('pdf-modal-close');
            const pdfDownloadAgainBtn = document.getElementById('pdf-download-again-btn');
            const pdfPrintNowBtn = document.getElementById('pdf-print-now-btn');

            if (pdfModalClose) pdfModalClose.addEventListener('click', closePdfPreviewModal);
            if (pdfModal) {
                pdfModal.addEventListener('click', (e) => {
                    if (e.target === pdfModal) closePdfPreviewModal();
                });
            }
            if (pdfDownloadAgainBtn) {
                pdfDownloadAgainBtn.addEventListener('click', triggerPdfDownload);
            }
            if (pdfPrintNowBtn) {
                pdfPrintNowBtn.addEventListener('click', () => {
                    closePdfPreviewModal();
                    window.print();
                });
            }

            const pngModal = document.getElementById('png-preview-modal');
            const pngModalClose = document.getElementById('png-modal-close');
            const pngDownloadAgainBtn = document.getElementById('png-download-again-btn');
            const pngCopyBtn = document.getElementById('png-copy-btn');
            const pngShareBtn = document.getElementById('png-share-btn');

            if (pngModalClose) pngModalClose.addEventListener('click', closePngPreviewModal);
            if (pngModal) {
                pngModal.addEventListener('click', (e) => {
                    if (e.target === pngModal) closePngPreviewModal();
                });
            }
            if (pngDownloadAgainBtn) pngDownloadAgainBtn.addEventListener('click', triggerPngDownload);
            if (pngCopyBtn) pngCopyBtn.addEventListener('click', copyPngToClipboard);
            if (pngShareBtn) pngShareBtn.addEventListener('click', sharePngFile);

            const colorPicker = document.getElementById('route-color-picker');
            if (colorPicker) {
                colorPicker.addEventListener('input', (e) => {
                    applyRouteColorToMap(e.target.value);
                });
                colorPicker.addEventListener('change', (e) => {
                    applyRouteColorToMap(e.target.value);
                });
            }

            const fileInput = document.getElementById('gpx-file-input');
            document.getElementById('import-btn').addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                handleGPXImport(e.target.files[0]);
                e.target.value = '';
            });

            document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
            document.getElementById('floating-menu-btn').addEventListener('click', toggleSidebar);

            setTimeout(() => {
                try { map.invalidateSize(); } catch (e) {}
            }, 250);

            window.addEventListener('resize', () => {
                try { map.invalidateSize(); } catch (e) {}
            });
            window.addEventListener('orientationchange', () => {
                try { map.invalidateSize(); } catch (e) {}
            });
        });
    </script>
</body>
</html>
