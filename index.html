        function addMarkerForPoint(wp, index) {
            const latlng = L.latLng(wp.lat, wp.lng);
            const icon = createIconForWaypoint(wp, index);
            const marker = L.marker(latlng, { draggable: true, icon }).addTo(map);

            marker.on('add', () => {
                const el = marker.getElement();
                if (!el) return;
                L.DomEvent.disableScrollPropagation(el);
                bindMarkerRootIsolation(el);

                const mapInput = el.querySelector('.waypoint-map-input');
                const mapDelBtn = el.querySelector('.wp-map-del');

                if (mapInput) {
                    bindMarkerInputIsolation(mapInput);
                    mapInput.addEventListener('focus', () => {
                        if (marker.dragging) marker.dragging.disable();
                    });
                    mapInput.addEventListener('blur', () => {
                        if (marker.dragging) marker.dragging.enable();
                        const idx = waypointMarkers.indexOf(marker);
                        if (idx !== -1) updateWaypointMarkerVisibility(idx);
                        if (historyInputTimer) recordHistoryState();
                    });
                    mapInput.addEventListener('input', (e) => {
                        const idx = waypointMarkers.indexOf(marker);
                        if (idx === -1) return;
                        const val = e.target.value;
                        currentWaypoints[idx].label = val;
                        mapInput.style.width = measureInputWidth(val, `Point ${idx + 1}`);
                        const sidebarInput = document.querySelector(`.wp-label-input[data-wp-idx="${idx}"]`);
                        if (sidebarInput) sidebarInput.value = val;
                        scheduleHistoryCommit();
                    });
                }

                bindMarkerDeleteButton(mapDelBtn, () => {
                    const idx = waypointMarkers.indexOf(marker);
                    if (idx !== -1) removeWaypointAtIndex(idx);
                });

                const addedIdx = waypointMarkers.indexOf(marker);
                updateWaypointMarkerVisibility(addedIdx !== -1 ? addedIdx : index);
            });

            marker.on('dragstart', () => {
                isDraggingMarker = true;
                suppressMapClickUntil = Date.now() + 800;
            });

            marker.on('drag', () => {
                suppressMapClickUntil = Date.now() + 800;
                const pos = marker.getLatLng();
                const idx = waypointMarkers.indexOf(marker);
                if (idx !== -1) {
                    currentWaypoints[idx].lat = pos.lat;
                    currentWaypoints[idx].lng = pos.lng;
                    renderPreviewRoutePolyline();
                }
            });

            marker.on('dragend', () => {
                isDraggingMarker = false;
                suppressMapClickUntil = Date.now() + 800;
                const pos = marker.getLatLng();
                const idx = waypointMarkers.indexOf(marker);
                if (idx !== -1) {
                    currentWaypoints[idx].lat = pos.lat;
                    currentWaypoints[idx].lng = pos.lng;
                    recordHistoryState();
                    updateRoutingWaypoints();
                }
            });

            waypointMarkers.push(marker);
            return marker;
        }

        function addMarkerForTextBox(tb, focusNew) {
            const latlng = L.latLng(tb.lat, tb.lng);
            const icon = createIconForTextBox(tb);
            const marker = L.marker(latlng, { draggable: true, icon }).addTo(map);

            marker.on('add', () => {
                const el = marker.getElement();
                if (!el) return;
                L.DomEvent.disableScrollPropagation(el);
                bindMarkerRootIsolation(el);

                const mapTextarea = el.querySelector('.map-textbox-input');
                const mapDelBtn = el.querySelector('.map-textbox-del');

                if (mapTextarea) {
                    autoResizeTextarea(mapTextarea);
                    bindMarkerInputIsolation(mapTextarea);
                    mapTextarea.addEventListener('focus', () => {
                        if (marker.dragging) marker.dragging.disable();
                    });
                    mapTextarea.addEventListener('blur', () => {
                        if (marker.dragging) marker.dragging.enable();
                    });
                    mapTextarea.addEventListener('input', (e) => {
                        const idx = textBoxMarkers.indexOf(marker);
                        if (idx === -1) return;
                        const val = e.target.value;
                        currentTextBoxes[idx].text = val;
                        autoResizeTextarea(mapTextarea);
                        const sidebarInput = document.querySelector(`.tb-sidebar-input[data-tb-idx="${idx}"]`);
                        if (sidebarInput) sidebarInput.value = val;
                        scheduleAutoSave(550);
                    });
                    if (focusNew) {
                        setTimeout(() => mapTextarea.focus(), 30);
                    }
                }

                bindMarkerDeleteButton(mapDelBtn, () => {
                    const idx = textBoxMarkers.indexOf(marker);
                    if (idx !== -1) removeTextBoxAtIndex(idx);
                });
            });

            marker.on('dragstart', () => {
                isDraggingMarker = true;
                suppressMapClickUntil = Date.now() + 800;
            });

            marker.on('drag', () => {
                suppressMapClickUntil = Date.now() + 800;
            });

            marker.on('dragend', () => {
                isDraggingMarker = false;
                suppressMapClickUntil = Date.now() + 800;
                const pos = marker.getLatLng();
                const idx = textBoxMarkers.indexOf(marker);
                if (idx !== -1) {
                    currentTextBoxes[idx].lat = pos.lat;
                    currentTextBoxes[idx].lng = pos.lng;
                    scheduleAutoSave(400);
                }
            });

            textBoxMarkers.push(marker);
            return marker;
        }

        function clearMarkers() {
            waypointMarkers.forEach(m => {
                try { map.removeLayer(m); } catch (e) {}
            });
            waypointMarkers = [];
        }

        function clearTextBoxMarkers() {
            textBoxMarkers.forEach(m => {
                try { map.removeLayer(m); } catch (e) {}
            });
            textBoxMarkers = [];
        }

        function syncMarkersToWaypoints() {
            clearMarkers();
            currentWaypoints.forEach((wp, idx) => addMarkerForPoint(wp, idx));
            renderSidebarWaypointList();
        }

        function syncTextBoxMarkers(focusLast) {
            clearTextBoxMarkers();
            currentTextBoxes.forEach((tb, idx) => {
                const shouldFocus = Boolean(focusLast && idx === currentTextBoxes.length - 1);
                addMarkerForTextBox(tb, shouldFocus);
            });
            renderSidebarTextBoxList();
        }

        function addWaypoint(latlng) {
            initRouting();
            let defaultLabel = '';
            let defaultIcon = 'default';
            if (currentWaypoints.length === 0) {
                defaultLabel = 'Start';
                defaultIcon = 'start';
            } else if (currentWaypoints.length === 1) {
                defaultLabel = 'Finish';
                defaultIcon = 'finish';
            }

            currentWaypoints.push({
                lat: latlng.lat,
                lng: latlng.lng,
                label: defaultLabel,
                notes: '',
                icon: defaultIcon,
                direct: false
            });
            syncMarkersToWaypoints();
            recordHistoryState();
            updateRoutingWaypoints();
        }

        function addTextBox(latlng) {
            currentTextBoxes.push({
                id: 'tb_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                lat: latlng.lat,
                lng: latlng.lng,
                text: ''
            });
            syncTextBoxMarkers(true);
            setTextBoxPlacementMode(false);
            scheduleAutoSave(400);
        }

        function saveCurrentRoute() {
            const nameInput = document.getElementById('route-name');
            const notesInput = document.getElementById('route-notes');
            const name = nameInput ? nameInput.value.trim() : '';
            const notes = notesInput ? notesInput.value.trim() : '';

            if (!name) {
                showToast('Please enter a route name.');
                if (nameInput) nameInput.focus();
                return;
            }

            if (!Array.isArray(currentWaypoints) || currentWaypoints.length < 2) {
                showToast('Add at least two waypoints on the map before saving.');
                return;
            }

            const computedDistance = currentRouteDistanceMeters > 0
                ? currentRouteDistanceMeters
                : calculatePolylineDistanceMeters(
                    currentRouteGeometry && currentRouteGeometry.length > 0 ? currentRouteGeometry : currentWaypoints
                );

            const routeData = {
                id: 'route_' + Date.now(),
                name: name,
                notes: notes,
                color: currentRouteColor,
                routingMode: currentRoutingMode,
                distanceMeters: computedDistance,
                waypoints: currentWaypoints.map(wp => ({
                    lat: Number(wp.lat),
                    lng: Number(wp.lng),
                    label: wp.label || '',
                    notes: wp.notes || wp.note || '',
                    icon: normalizeWaypointIconId(wp.icon),
                    direct: Boolean(wp.direct)
                })),
                textBoxes: currentTextBoxes.map(tb => ({
                    id: tb.id,
                    lat: Number(tb.lat),
                    lng: Number(tb.lng),
                    text: tb.text || ''
                })),
                geometry: currentRouteGeometry && currentRouteGeometry.length > 0
                    ? currentRouteGeometry
                    : currentWaypoints.map(wp => ({ lat: Number(wp.lat), lng: Number(wp.lng) })),
                createdAt: new Date().toISOString()
            };

            const existing = getSavedDrives();
            existing.push(routeData);
            setSavedDrives(existing);

            clearCurrentMap();
            loadSavedRoutes();
            showToast(`Saved "${name}"`);
        }

        function loadSavedRoutes() {
            const listContainer = document.getElementById('route-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            const routes = getSavedDrives();

            if (routes.length === 0) {
                listContainer.innerHTML = '<p class="hint">No saved routes yet.</p>';
                return;
            }

            routes.forEach(route => {
                const card = document.createElement('div');
                card.className = 'route-card';
                const tbCount = Array.isArray(route.textBoxes) ? route.textBoxes.length : 0;
                const distMeters = typeof route.distanceMeters === 'number' && route.distanceMeters > 0
                    ? route.distanceMeters
                    : calculatePolylineDistanceMeters(
                        Array.isArray(route.geometry) && route.geometry.length > 1 ? route.geometry : (route.waypoints || [])
                    );
                const summaryParts = [`${route.waypoints.length} Waypoints`];
                if (distMeters > 0) summaryParts.push(formatDistance(distMeters));
                if (tbCount > 0) summaryParts.push(`${tbCount} Text Box${tbCount === 1 ? '' : 'es'}`);
                const summaryText = summaryParts.join(' · ');

                if (editingRouteId === route.id) {
                    card.innerHTML = `
                        <div class="route-edit-fields">
                            <input type="text" class="edit-route-name" value="${escapeHtml(route.name)}" placeholder="Route name..." />
                            <textarea class="edit-route-notes" placeholder="Route notes...">${escapeHtml(route.notes || '')}</textarea>
                        </div>
                        <div class="card-actions">
                            <button data-action="save-edit" data-id="${route.id}">Save</button>
                            <button class="secondary" data-action="cancel-edit" data-id="${route.id}">Cancel</button>
                        </div>
                    `;
                } else {
                    const notesHtml = route.notes
                        ? `<div class="route-card-notes">${escapeHtml(route.notes)}</div>`
                        : '';
                    card.innerHTML = `
                        <h3>${escapeHtml(route.name)}</h3>
                        <p>${summaryText}</p>
                        ${notesHtml}
                        <div class="card-actions">
                            <button class="secondary" data-action="view" data-id="${route.id}">View</button>
                            <button class="secondary" data-action="edit" data-id="${route.id}">Edit</button>
                            <button class="secondary" data-action="export" data-id="${route.id}">Export GPX</button>
                            <button class="danger" data-action="delete" data-id="${route.id}">Delete</button>
                        </div>
                    `;
                }
                listContainer.appendChild(card);
            });

            listContainer.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', function () {
                    const act = this.getAttribute('data-action');
                    const id = this.getAttribute('data-id');
                    if (act === 'view') displayRoute(id);
                    else if (act === 'edit') {
                        editingRouteId = id;
                        loadSavedRoutes();
                    }
                    else if (act === 'cancel-edit') {
                        editingRouteId = null;
                        loadSavedRoutes();
                    }
                    else if (act === 'save-edit') {
                        const card = this.closest('.route-card');
                        const newName = card.querySelector('.edit-route-name').value.trim();
                        const newNotes = card.querySelector('.edit-route-notes').value.trim();
                        if (!newName) {
                            showToast('Route name cannot be empty.');
                            return;
                        }
                        const allRoutes = getSavedDrives();
                        const target = allRoutes.find(r => r.id === id);
                        if (target) {
                            target.name = newName;
                            target.notes = newNotes;
                            setSavedDrives(allRoutes);
                        }
                        editingRouteId = null;
                        loadSavedRoutes();
                        showToast('Route details updated.');
                    }
                    else if (act === 'export') exportGPX(id);
                    else if (act === 'delete') deleteRoute(id);
                });
            });
        }

        function displayRoute(id) {
            const routes = getSavedDrives();
            const route = routes.find(r => r.id === id);
            if (!route) return;

            clearCurrentMap({ skipHistory: true, skipClearDraft: true });

            const nameInput = document.getElementById('route-name');
            const notesInput = document.getElementById('route-notes');
            if (nameInput) nameInput.value = route.name || '';
            if (notesInput) notesInput.value = route.notes || '';

            currentWaypoints = (route.waypoints || []).map(w => ({
                lat: w.lat,
                lng: w.lng,
                label: w.label || '',
                notes: w.notes || w.note || '',
                icon: normalizeWaypointIconId(w.icon),
                direct: Boolean(w.direct)
            }));
            if (route.routingMode) {
                setRoutingMode(normalizeRoutingMode(route.routingMode), { skipRecalc: true, silent: true });
            }
            currentTextBoxes = (route.textBoxes || []).map((tb, idx) => ({
                id: tb.id || ('tb_' + Date.now() + '_' + idx),
                lat: tb.lat,
                lng: tb.lng,
                text: tb.text || ''
            }));
            currentRouteGeometry = route.geometry || [];
            currentRouteDistanceMeters = typeof route.distanceMeters === 'number' && route.distanceMeters > 0
                ? route.distanceMeters
                : calculatePolylineDistanceMeters(currentRouteGeometry.length > 1 ? currentRouteGeometry : currentWaypoints);
            applyRouteColorToMap(route.color || DEFAULT_ROUTE_COLOR);

            syncMarkersToWaypoints();
            syncTextBoxMarkers(false);

            initRouting();
            if (currentRouteGeometry.length >= 2) {
                drawRouteLines(currentRouteGeometry, currentWaypoints, false);
                updateRouteDistanceDisplay();
                recordHistoryState();
                refreshElevationProfile();
            } else {
                recordHistoryState();
                updateRoutingWaypoints();
            }

            const allCoords = [
                ...currentWaypoints.map(w => L.latLng(w.lat, w.lng)),
                ...currentTextBoxes.map(tb => L.latLng(tb.lat, tb.lng))
            ];
            if (allCoords.length > 0) {
                map.fitBounds(L.latLngBounds(allCoords), { padding: [50, 50] });
            }
        }

        function deleteRoute(id) {
            let routes = getSavedDrives();
            routes = routes.filter(r => r.id !== id);
            setSavedDrives(routes);
            if (editingRouteId === id) editingRouteId = null;
            loadSavedRoutes();
            clearCurrentMap();
            showToast('Route deleted.');
        }

        function escapeXml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&apos;'
            })[m]);
        }

        function normalizeHexColor(color) {
            if (typeof color !== 'string') return DEFAULT_ROUTE_COLOR.toUpperCase();
            const trimmed = color.trim();
            if (/^#[0-9a-fA-F]{6}$/.test(trimmed)) return trimmed.toUpperCase();
            if (/^[0-9a-fA-F]{6}$/.test(trimmed)) return `#${trimmed.toUpperCase()}`;
            if (/^#[0-9a-fA-F]{3}$/.test(trimmed)) {
                const r = trimmed[1], g = trimmed[2], b = trimmed[3];
                return `#${r}${r}${g}${g}${b}${b}`.toUpperCase();
            }
            return DEFAULT_ROUTE_COLOR.toUpperCase();
        }

        const GARMIN_DISPLAY_COLORS = [
            { name: 'Black', rgb: [0, 0, 0], hex: '#000000' },
            { name: 'DarkRed', rgb: [139, 0, 0], hex: '#8B0000' },
            { name: 'DarkGreen', rgb: [0, 100, 0], hex: '#006400' },
            { name: 'DarkYellow', rgb: [184, 134, 11], hex: '#B8860B' },
            { name: 'DarkBlue', rgb: [0, 0, 139], hex: '#00008B' },
            { name: 'DarkMagenta', rgb: [139, 0, 139], hex: '#8B008B' },
            { name: 'DarkCyan', rgb: [0, 139, 139], hex: '#008B8B' },
            { name: 'LightGray', rgb: [211, 211, 211], hex: '#D3D3D3' },
            { name: 'DarkGray', rgb: [105, 105, 105], hex: '#696969' },
            { name: 'Red', rgb: [255, 0, 0], hex: '#FF0000' },
            { name: 'Green', rgb: [0, 180, 0], hex: '#00B400' },
            { name: 'Yellow', rgb: [255, 215, 0], hex: '#FFD700' },
            { name: 'Blue', rgb: [43, 142, 214], hex: '#2B8ED6' },
            { name: 'Magenta', rgb: [255, 0, 255], hex: '#FF00FF' },
            { name: 'Cyan', rgb: [0, 200, 220], hex: '#00C8DC' },
            { name: 'White', rgb: [255, 255, 255], hex: '#FFFFFF' }
        ];

        function hexToGarminDisplayColor(hex) {
            const safe = normalizeHexColor(hex);
            const r = parseInt(safe.slice(1, 3), 16);
            const g = parseInt(safe.slice(3, 5), 16);
            const b = parseInt(safe.slice(5, 7), 16);
            let bestName = 'Blue';
            let bestDist = Infinity;
            GARMIN_DISPLAY_COLORS.forEach((c) => {
                const dr = r - c.rgb[0];
                const dg = g - c.rgb[1];
                const db = b - c.rgb[2];
                const dist = dr * dr + dg * dg + db * db;
                if (dist < bestDist) {
                    bestDist = dist;
                    bestName = c.name;
                }
            });
            return bestName;
        }

        function garminDisplayColorToHex(name) {
            if (!name) return null;
            const norm = String(name).trim().toLowerCase();
            const match = GARMIN_DISPLAY_COLORS.find((c) => c.name.toLowerCase() === norm);
            return match ? match.hex : null;
        }

        function extractGpxRouteColor(xmlDoc) {
            if (!xmlDoc) return null;
            const allNodes = xmlDoc.getElementsByTagName('*');
            let fallbackGarmin = null;
            let metadataColor = null;

            for (let i = 0; i < allNodes.length; i++) {
                const node = allNodes[i];
                const local = (node.localName || node.nodeName || '').split(':').pop();
                const insideWpt = Boolean(node.closest && node.closest('wpt'));
                if (insideWpt) continue;

                if (local === 'color') {
                    const txt = (node.textContent || '').trim();
                    if (/^#?[0-9a-fA-F]{6}$/.test(txt) || /^#[0-9a-fA-F]{3}$/.test(txt)) {
                        const hex = normalizeHexColor(txt);
                        if (node.closest && node.closest('trk, rte')) {
                            return hex;
                        }
                        if (!metadataColor) metadataColor = hex;
                    }
                } else if (local === 'DisplayColor' && !fallbackGarmin) {
                    const hex = garminDisplayColorToHex(node.textContent);
                    if (hex) fallbackGarmin = hex;
                }
            }
            return metadataColor || fallbackGarmin;
        }

        function exportGPX(id) {
            const routes = getSavedDrives();
            const route = routes.find(r => r.id === id);
            if (!route) return;

            const pointsToExport = (route.geometry && route.geometry.length > 0)
                ? route.geometry
                : route.waypoints;

            const routeHex = normalizeHexColor(route.color || DEFAULT_ROUTE_COLOR);
            const routeHexNoHash = routeHex.slice(1);
            const garminColor = hexToGarminDisplayColor(routeHex);
            const strokeWidth = 5;
            const strokeOpacity = '0.95';
            const exportTime = route.createdAt || new Date().toISOString();
            const totalWpts = Array.isArray(route.waypoints) ? route.waypoints.length : 0;

            let gpxContent = '<?xml version="1.0" encoding="UTF-8"?>\n';
            gpxContent += '<gpx version="1.1" creator="RouteCraft" '
                + 'xmlns="http://www.topografix.com/GPX/1/1" '
                + 'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" '
                + 'xmlns:gpxx="http://www.garmin.com/xmlschemas/GpxExtensions/v3" '
                + 'xmlns:gpx_style="http://www.topografix.com/GPX/gpx_style/0/2" '
                + 'xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">\n';

            // Top-level metadata & route visual theme extensions
            gpxContent += '  <metadata>\n';
            gpxContent += `    <name>${escapeXml(route.name || 'RouteCraft Route')}</name>\n`;
            if (route.notes) {
                gpxContent += `    <desc>${escapeXml(route.notes)}</desc>\n`;
            }
            gpxContent += `    <time>${escapeXml(exportTime)}</time>\n`;
            gpxContent += '    <extensions>\n';
            gpxContent += `      <color>${routeHex}</color>\n`;
            gpxContent += '      <gpx_style:line>\n';
            gpxContent += `        <gpx_style:color>${routeHexNoHash}</gpx_style:color>\n`;
            gpxContent += `        <gpx_style:opacity>${strokeOpacity}</gpx_style:opacity>\n`;
            gpxContent += `        <gpx_style:width>${strokeWidth}</gpx_style:width>\n`;
            gpxContent += '      </gpx_style:line>\n';
            gpxContent += '    </extensions>\n';
            gpxContent += '  </metadata>\n';

            // Waypoints with marker symbol, selected icon metadata, role type, and display extensions
            (route.waypoints || []).forEach((pt, index) => {
                const wptName = pt.label ? pt.label : `Waypoint ${index + 1}`;
                const wptNotes = pt.notes || pt.note || '';
                const hasExplicitIcon = typeof pt.icon === 'string' && Object.prototype.hasOwnProperty.call(WAYPOINT_ICONS, pt.icon.trim().toLowerCase());
                const fallbackIconId = index === 0 ? 'start' : (totalWpts > 1 && index === totalWpts - 1 ? 'finish' : 'default');
                const iconMeta = WAYPOINT_ICONS[hasExplicitIcon ? normalizeWaypointIconId(pt.icon) : fallbackIconId];
                const markerHex = iconMeta.id === 'default' ? routeHex : normalizeHexColor(iconMeta.color);
                const markerGarmin = iconMeta.id === 'default' ? garminColor : iconMeta.garminColor;

                gpxContent += `  <wpt lat="${pt.lat}" lon="${pt.lng}">\n`;
                gpxContent += `    <name>${escapeXml(wptName)}</name>\n`;
                if (wptNotes) {
                    gpxContent += `    <desc>${escapeXml(wptNotes)}</desc>\n`;
                }
                gpxContent += `    <sym>${escapeXml(iconMeta.gpxSym)}</sym>\n`;
                gpxContent += `    <type>${escapeXml(iconMeta.gpxType)}</type>\n`;
                gpxContent += '    <extensions>\n';
                gpxContent += `      <color>${markerHex}</color>\n`;
                gpxContent += `      <icon>${escapeXml(iconMeta.gpxIcon)}</icon>\n`;
                gpxContent += `      <iconId>${escapeXml(iconMeta.id)}</iconId>\n`;
                gpxContent += `      <iconLabel>${escapeXml(iconMeta.label)}</iconLabel>\n`;
                gpxContent += '      <gpxx:WaypointExtension>\n';
                gpxContent += '        <gpxx:DisplayMode>SymbolAndName</gpxx:DisplayMode>\n';
                gpxContent += `        <gpxx:Categories><gpxx:Category>${escapeXml(iconMeta.label)}</gpxx:Category><gpxx:Category>${escapeXml(markerGarmin)}</gpxx:Category></gpxx:Categories>\n`;
                gpxContent += '      </gpxx:WaypointExtension>\n';
                gpxContent += '    </extensions>\n';
                gpxContent += '  </wpt>\n';
            });

            // Map text box annotations with note marker styling
            if (Array.isArray(route.textBoxes)) {
                route.textBoxes.forEach((tb, index) => {
                    gpxContent += `  <wpt lat="${tb.lat}" lon="${tb.lng}">\n`;
                    gpxContent += `    <name>Note ${index + 1}</name>\n`;
                    gpxContent += `    <desc>${escapeXml(tb.text || '')}</desc>\n`;
                    gpxContent += '    <sym>Information</sym>\n';
                    gpxContent += '    <type>routecraft-textbox</type>\n';
                    gpxContent += '    <extensions>\n';
                    gpxContent += '      <color>#F59E0B</color>\n';
                    gpxContent += '      <icon>note</icon>\n';
                    gpxContent += '      <gpxx:WaypointExtension>\n';
                    gpxContent += '        <gpxx:DisplayMode>SymbolAndName</gpxx:DisplayMode>\n';
                    gpxContent += '      </gpxx:WaypointExtension>\n';
                    gpxContent += '    </extensions>\n';
                    gpxContent += '  </wpt>\n';
                });
            }

            // Track with Garmin gpxx, Topografix gpx_style, and OsmAnd/generic color & width styling
            gpxContent += '  <trk>\n';
            gpxContent += `    <name>${escapeXml(route.name)}</name>\n`;
            if (route.notes) {
                gpxContent += `    <desc>${escapeXml(route.notes)}</desc>\n`;
            }
            gpxContent += '    <type>RouteCraft</type>\n';
            gpxContent += '    <extensions>\n';
            gpxContent += `      <color>${routeHex}</color>\n`;
            gpxContent += `      <width>${strokeWidth}</width>\n`;
            gpxContent += '      <gpxx:TrackExtension>\n';
            gpxContent += `        <gpxx:DisplayColor>${garminColor}</gpxx:DisplayColor>\n`;
            gpxContent += '      </gpxx:TrackExtension>\n';
            gpxContent += '      <gpx_style:line>\n';
            gpxContent += `        <gpx_style:color>${routeHexNoHash}</gpx_style:color>\n`;
            gpxContent += `        <gpx_style:opacity>${strokeOpacity}</gpx_style:opacity>\n`;
            gpxContent += `        <gpx_style:width>${strokeWidth}</gpx_style:width>\n`;
            gpxContent += '      </gpx_style:line>\n';
            gpxContent += '    </extensions>\n';
            gpxContent += '    <trkseg>\n';
            pointsToExport.forEach(pt => {
                gpxContent += `      <trkpt lat="${pt.lat}" lon="${pt.lng}"></trkpt>\n`;
            });
            gpxContent += '    </trkseg>\n';
            gpxContent += '  </trk>\n';
            gpxContent += '</gpx>';

            const safeFilename = (route.name || 'routecraft_route')
                .toLowerCase()
                .replace(/[^a-z0-9_-]+/g, '_')
                .replace(/^_+|_+$/g, '') || 'routecraft_route';

            const blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${safeFilename}.gpx`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
            showToast(`Exported ${safeFilename}.gpx`);
        }

        function handleGPXImport(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, 'text/xml');

                const wpts = xmlDoc.querySelectorAll('wpt');
                const trkpts = xmlDoc.querySelectorAll('trkpt, rtept');

                if ((!trkpts || trkpts.length === 0) && (!wpts || wpts.length === 0)) {
                    showToast('No valid waypoints or track points found in this GPX file.');
                    return;
                }

                const trkNameNode = xmlDoc.querySelector('trk > name') || xmlDoc.querySelector('metadata > name') || xmlDoc.querySelector('name');
                const trkDescNode = xmlDoc.querySelector('trk > desc') || xmlDoc.querySelector('metadata > desc');
                const defaultName = trkNameNode ? trkNameNode.textContent.trim() : file.name.replace(/\.[^/.]+$/, '');
                const defaultNotes = trkDescNode ? trkDescNode.textContent.trim() : '';
                const importedColor = extractGpxRouteColor(xmlDoc) || DEFAULT_ROUTE_COLOR;

                let importedWaypoints = [];
                let importedTextBoxes = [];

                if (wpts && wpts.length > 0) {
                    Array.from(wpts).forEach((wpt, idx) => {
                        const lat = parseFloat(wpt.getAttribute('lat'));
                        const lng = parseFloat(wpt.getAttribute('lon'));
                        if (isNaN(lat) || isNaN(lng)) return;

                        const typeEl = wpt.querySelector('type');
                        const nameEl = wpt.querySelector('name');
                        const descEl = wpt.querySelector('desc');

                        if (typeEl && typeEl.textContent.trim() === 'routecraft-textbox') {
                            importedTextBoxes.push({
                                id: 'tb_' + Date.now() + '_' + idx,
                                lat,
                                lng,
                                text: descEl ? descEl.textContent.trim() : (nameEl ? nameEl.textContent.trim() : '')
                            });
                        } else {
                            importedWaypoints.push({
                                lat,
                                lng,
                                label: nameEl ? nameEl.textContent.trim() : '',
                                notes: descEl ? descEl.textContent.trim() : '',
                                icon: inferWaypointIconFromGpx(wpt)
                            });
                        }
                    });
                }

                if (importedWaypoints.length < 2 && trkpts && trkpts.length > 0) {
                    let pts = Array.from(trkpts).map(pt => ({
                        lat: parseFloat(pt.getAttribute('lat')),
                        lng: parseFloat(pt.getAttribute('lon'))
                    })).filter(pt => !isNaN(pt.lat) && !isNaN(pt.lng));

                    if (pts.length > 20) {
                        const step = Math.ceil(pts.length / 15);
                        pts = pts.filter((_, idx) => idx % step === 0 || idx === pts.length - 1);
                    }
                    importedWaypoints = pts.map((p, idx) => ({
                        lat: p.lat,
                        lng: p.lng,
                        label: idx === 0 ? 'Start' : (idx === pts.length - 1 ? 'Finish' : ''),
                        notes: '',
                        icon: idx === 0 ? 'start' : (idx === pts.length - 1 ? 'finish' : 'default')
                    }));
                }

                clearCurrentMap({ skipHistory: true, skipClearDraft: true });
                document.getElementById('route-name').value = defaultName;
                document.getElementById('route-notes').value = defaultNotes;
                applyRouteColorToMap(importedColor);
                currentWaypoints = importedWaypoints;
                currentTextBoxes = importedTextBoxes;

                initRouting();
                syncMarkersToWaypoints();
                syncTextBoxMarkers(false);
                recordHistoryState();
                updateRoutingWaypoints();

                const allCoords = [
                    ...currentWaypoints.map(w => L.latLng(w.lat, w.lng)),
                    ...currentTextBoxes.map(tb => L.latLng(tb.lat, tb.lng))
                ];
                if (allCoords.length > 0) {
                    map.fitBounds(L.latLngBounds(allCoords), { padding: [50, 50] });
                }
                showToast(`Imported "${defaultName}"`);
            };
            reader.readAsText(file);
        }

        function clearCurrentMap(options) {
            const opts = options || {};
            routeRequestSeq++;
            currentWaypoints = [];
            currentTextBoxes = [];
            currentRouteGeometry = [];
            currentRouteDistanceMeters = 0;
            applyRouteColorToMap(DEFAULT_ROUTE_COLOR);
            setTextBoxPlacementMode(false);

            const nameInput = document.getElementById('route-name');
            const notesInput = document.getElementById('route-notes');
            if (nameInput) nameInput.value = '';
            if (notesInput) notesInput.value = '';

            if (routeLayerGroup) routeLayerGroup.clearLayers();
            routePolylineLayers = [];
            clearMarkers();
            clearTextBoxMarkers();
            renderSidebarWaypointList();
            renderSidebarTextBoxList();
            updateRouteDistanceDisplay();

            if (!opts.skipHistory) {
                recordHistoryState();
            }
            if (!opts.skipClearDraft) {
                clearAutoSaveDraft();
            }
            refreshElevationProfile();
        }

        function toggleSidebar() {
            const collapsed = document.body.classList.toggle('sidebar-collapsed');
            document.getElementById('sidebar').setAttribute('aria-hidden', String(collapsed));
            setTimeout(() => {
                try { map.invalidateSize(); } catch (e) {}
            }, 300);
        }

        function loadCorsTileImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                let settled = false;
                const finish = (result) => {
                    if (settled) return;
                    settled = true;
                    resolve(result);
                };
                const timer = setTimeout(() => finish(null), 2500);
                img.onload = () => {
                    clearTimeout(timer);
                    finish(img);
                };
                img.onerror = () => {
                    clearTimeout(timer);
                    finish(null);
                };
                const sep = url.includes('?') ? '&' : '?';
                img.src = `${url}${sep}cors=1`;
            });
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        function wrapCanvasLines(ctx, text, maxWidth) {
            const rawLines = String(text || '').split(/\r?\n/);
            const lines = [];
            rawLines.forEach((rawLine) => {
                const words = rawLine.split(/\s+/);
                let current = '';
                words.forEach((word) => {
                    const test = current ? `${current} ${word}` : word;
                    if (ctx.measureText(test).width > maxWidth && current) {
                        lines.push(current);
                        current = word;
                    } else {
                        current = test;
                    }
                });
                lines.push(current);
            });
            return lines;
        }

        async function renderRouteSnapshotCanvas(options) {
            const opts = options || {};
            const includeDocumentHeader = Boolean(opts.includeDocumentHeader);
            const skipExternalTiles = Boolean(opts.skipExternalTiles);
            const size = map.getSize();
            const mapWidth = Math.max(320, size.x);
            const mapHeight = Math.max(240, size.y);
            const headerHeight = includeDocumentHeader ? 62 : 0;
            const footerHeight = 26;
            const scale = 2;

            const canvas = document.createElement('canvas');
            canvas.width = mapWidth * scale;
            canvas.height = (mapHeight + headerHeight + footerHeight) * scale;
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);

            // Base background
            ctx.fillStyle = '#e9eef5';
            ctx.fillRect(0, 0, mapWidth, mapHeight + headerHeight + footerHeight);

            // Clip map viewport area
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, headerHeight, mapWidth, mapHeight);
            ctx.clip();
            ctx.translate(0, headerHeight);

            // Subtle cartographic grid backdrop (visible if any tile is slow/offline)
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
            ctx.lineWidth = 1;
            for (let gx = 0; gx <= mapWidth; gx += 48) {
                ctx.beginPath();
                ctx.moveTo(gx, 0);
                ctx.lineTo(gx, mapHeight);
                ctx.stroke();
            }
            for (let gy = 0; gy <= mapHeight; gy += 48) {
                ctx.beginPath();
                ctx.moveTo(0, gy);
                ctx.lineTo(mapWidth, gy);
                ctx.stroke();
            }

            // Render visible base map tiles (respecting active map style & maxNativeZoom)
            if (!skipExternalTiles) {
                const currentZoom = Math.round(map.getZoom());
                const maxNative = activeMapStyle === 'landranger' ? 17 : 19;
                const fetchZoom = Math.min(maxNative, currentZoom);
                const zoomDiff = currentZoom - fetchZoom;
                const zoomScale = Math.pow(2, zoomDiff);
                const pixelBounds = map.getPixelBounds();
                const tileSize = 256;
                const displayTileSize = tileSize * zoomScale;
                const maxTileIndex = Math.pow(2, fetchZoom) - 1;
                const minTileX = Math.max(0, Math.floor(pixelBounds.min.x / displayTileSize));
                const maxTileX = Math.min(maxTileIndex, Math.floor(pixelBounds.max.x / displayTileSize));
                const minTileY = Math.max(0, Math.floor(pixelBounds.min.y / displayTileSize));
                const maxTileY = Math.min(maxTileIndex, Math.floor(pixelBounds.max.y / displayTileSize));

                const tileUrlFor = (z, x, y) => {
                    if (activeMapStyle === 'landranger') return `https://a.tile.opentopomap.org/${z}/${x}/${y}.png`;
                    if (activeMapStyle === 'cyclosm') return `https://a.tile-cyclosm.openstreetmap.fr/cyclosm/${z}/${x}/${y}.png`;
                    if (activeMapStyle === 'dark') return `https://a.basemaps.cartocdn.com/dark_all/${z}/${x}/${y}.png`;
                    return `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
                };

                const tilePromises = [];
                for (let tx = minTileX; tx <= maxTileX; tx++) {
                    for (let ty = minTileY; ty <= maxTileY; ty++) {
                        const url = tileUrlFor(fetchZoom, tx, ty);
                        const dx = tx * displayTileSize - pixelBounds.min.x;
                        const dy = ty * displayTileSize - pixelBounds.min.y;
                        tilePromises.push(
                            loadCorsTileImage(url).then((img) => ({ img, dx, dy, size: displayTileSize }))
                        );
                    }
                }

                const tiles = await Promise.all(tilePromises);
                tiles.forEach(({ img, dx, dy, size }) => {
                    if (img) {
                        try {
                            ctx.drawImage(img, dx, dy, size, size);
                        } catch (e) {}
                    }
                });
            }

            // Draw route polyline
            const linePoints = (currentRouteGeometry && currentRouteGeometry.length >= 2)
                ? currentRouteGeometry
                : currentWaypoints;

            if (linePoints && linePoints.length >= 2) {
                const projected = linePoints.map((pt) => map.latLngToContainerPoint(L.latLng(pt.lat, pt.lng)));
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // White casing
                ctx.beginPath();
                projected.forEach((p, idx) => {
                    if (idx === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 8;
                ctx.stroke();

                // Colored route stroke
                ctx.beginPath();
                projected.forEach((p, idx) => {
                    if (idx === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.strokeStyle = currentRouteColor;
                ctx.lineWidth = 5;
                ctx.stroke();

                // Off-road dashed connectors for start/end waypoints if snapped away
                if (currentRouteGeometry && currentRouteGeometry.length >= 2 && currentWaypoints.length >= 2) {
                    const firstWp = L.latLng(currentWaypoints[0].lat, currentWaypoints[0].lng);
                    const lastWp = L.latLng(currentWaypoints[currentWaypoints.length - 1].lat, currentWaypoints[currentWaypoints.length - 1].lng);
                    const firstRoute = L.latLng(currentRouteGeometry[0].lat, currentRouteGeometry[0].lng);
                    const lastRoute = L.latLng(currentRouteGeometry[currentRouteGeometry.length - 1].lat, currentRouteGeometry[currentRouteGeometry.length - 1].lng);

                    ctx.save();
                    ctx.setLineDash([6, 6]);
                    ctx.strokeStyle = currentRouteColor;
                    ctx.lineWidth = 3.5;

                    if (firstWp.distanceTo(firstRoute) > 12) {
                        const p1 = map.latLngToContainerPoint(firstWp);
                        const p2 = map.latLngToContainerPoint(firstRoute);
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                    if (lastWp.distanceTo(lastRoute) > 12) {
                        const p1 = map.latLngToContainerPoint(lastRoute);
                        const p2 = map.latLngToContainerPoint(lastWp);
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            // Draw map text boxes
            currentTextBoxes.forEach((tb) => {
                const pt = map.latLngToContainerPoint(L.latLng(tb.lat, tb.lng));
                const boxW = 196;
                ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                const lines = wrapCanvasLines(ctx, tb.text || 'Note', boxW - 16);
                const bodyH = Math.max(30, lines.length * 16 + 12);
                const headerH = 20;
                const totalH = headerH + bodyH;
                const x = pt.x - boxW / 2;
                const y = pt.y - 14;

                ctx.save();
                ctx.shadowColor = 'rgba(15, 23, 42, 0.22)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 2;
                ctx.fillStyle = '#ffffff';
                drawRoundedRect(ctx, x, y, boxW, totalH, 7);
                ctx.fill();
                ctx.restore();

                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 1.5;
                drawRoundedRect(ctx, x, y, boxW, totalH, 7);
                ctx.stroke();

                ctx.save();
                drawRoundedRect(ctx, x, y, boxW, totalH, 7);
                ctx.clip();
                ctx.fillStyle = '#fef3c7';
                ctx.fillRect(x, y, boxW, headerH);
                ctx.restore();

                ctx.fillStyle = '#92400e';
                ctx.font = '700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText('NOTE', x + 8, y + 14);

                ctx.fillStyle = '#111827';
                ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                lines.forEach((line, idx) => {
                    ctx.fillText(line, x + 8, y + headerH + 16 + idx * 16);
                });
            });

            // Draw waypoint badges
            currentWaypoints.forEach((wp, idx) => {
                const pt = map.latLngToContainerPoint(L.latLng(wp.lat, wp.lng));
                const iconMeta = getWaypointIconMeta(wp);
                const rawLabel = wp.label ? wp.label : `Point ${idx + 1}`;
                const displayLabel = iconMeta.id !== 'default' ? `${iconMeta.emoji} ${rawLabel}` : rawLabel;
                ctx.font = '700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                const textW = ctx.measureText(displayLabel).width;
                const badgeW = Math.min(240, 34 + textW + 12);
                const badgeH = 28;
                const bx = pt.x - 14;
                const by = pt.y - 14;

                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetY = 2;
                ctx.fillStyle = iconMeta.color;
                drawRoundedRect(ctx, bx, by, badgeW, badgeH, 14);
                ctx.fill();
                ctx.restore();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                drawRoundedRect(ctx, bx, by, badgeW, badgeH, 14);
                ctx.stroke();

                // Number circle
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.arc(bx + 14, by + 14, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = '700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(idx + 1), bx + 14, by + 14.5);

                ctx.textAlign = 'left';
                ctx.font = '700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(displayLabel, bx + 30, by + 14.5, badgeW - 38);
                ctx.textBaseline = 'alphabetic';
            });

            ctx.restore();

            // Document header bar for standalone PNG export
            if (includeDocumentHeader) {
                const nameInput = document.getElementById('route-name');
                const routeTitle = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'RouteCraft Route';
                const distText = currentWaypoints.length >= 2
                    ? formatDistancePair(currentRouteDistanceMeters, ' / ')
                    : '0.0 km / 0.0 mi';

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, mapWidth, headerHeight);
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, headerHeight - 0.5);
                ctx.lineTo(mapWidth, headerHeight - 0.5);
                ctx.stroke();

                ctx.fillStyle = '#0f172a';
                ctx.font = '700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(routeTitle, 14, 26, Math.max(120, mapWidth - 170));

                ctx.fillStyle = '#475569';
                ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(`${distText}  ·  ${currentWaypoints.length} Waypoint${currentWaypoints.length === 1 ? '' : 's'}`, 14, 46);

                ctx.fillStyle = '#64748b';
                ctx.font = '700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText('ROUTECRAFT', mapWidth - 14, 25);
                ctx.textAlign = 'left';
            }

            // Attribution footer
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, headerHeight + mapHeight, mapWidth, footerHeight);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, headerHeight + mapHeight + 0.5);
            ctx.lineTo(mapWidth, headerHeight + mapHeight + 0.5);
            ctx.stroke();

            ctx.fillStyle = '#64748b';
            ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText('Map data © OpenStreetMap contributors · Generated by RouteCraft', 10, headerHeight + mapHeight + 17);

            return canvas;
        }

        async function renderSafeExportCanvas(includeDocumentHeader) {
            let canvas = await renderRouteSnapshotCanvas({ includeDocumentHeader });
            try {
                // Verify canvas is not CORS-tainted before downstream export
                canvas.toDataURL('image/png');
                return canvas;
            } catch (secErr) {
                console.warn('Snapshot tainted by external tile; rendering clean fallback map.', secErr);
                return await renderRouteSnapshotCanvas({ includeDocumentHeader, skipExternalTiles: true });
            }
        }

        function sanitizePdfText(str) {
            return String(str || '')
                .replace(/[\u2014\u2013]/g, '-')
                .replace(/[\u2018\u2019]/g, "'")
                .replace(/[\u201c\u201d]/g, '"')
                .replace(/[\u2022\u00b7]/g, '*')
                .replace(/[^\x20-\x7e]/g, ' ')
                .replace(/\\/g, '\\\\')
                .replace(/\(/g, '\\(')
                .replace(/\)/g, '\\)');
        }

        function wrapPdfLines(text, maxChars) {
            const rawLines = String(text || '').split(/\r?\n/);
            const out = [];
            rawLines.forEach((rawLine) => {
                const trimmed = rawLine.trim();
                if (!trimmed) {
                    out.push('');
                    return;
                }
                const words = trimmed.split(/\s+/);
                let line = '';
                words.forEach((word) => {
                    if (word.length > maxChars) {
                        if (line) {
                            out.push(line);
                            line = '';
                        }
                        for (let i = 0; i < word.length; i += maxChars) {
                            out.push(word.slice(i, i + maxChars));
                        }
                        return;
                    }
                    const next = line ? `${line} ${word}` : word;
                    if (next.length > maxChars) {
                        out.push(line);
                        line = word;
                    } else {
                        line = next;
                    }
                });
                if (line) out.push(line);
            });
            return out.length > 0 ? out : [''];
        }

        function hexToRgbPdf(hex) {
            const clean = /^#([0-9a-fA-F]{6})$/.exec(hex || '');
            if (!clean) return '0.169 0.557 0.839';
            const r = (parseInt(clean[1].slice(0, 2), 16) / 255).toFixed(3);
            const g = (parseInt(clean[1].slice(2, 4), 16) / 255).toFixed(3);
            const b = (parseInt(clean[1].slice(4, 6), 16) / 255).toFixed(3);
            return `${r} ${g} ${b}`;
        }

        function buildRoutePdfBlob(canvas, routeInfo) {
            const jpegUrl = canvas.toDataURL('image/jpeg', 0.9);
            const b64 = jpegUrl.split(',')[1];
            const bin = atob(b64);
            const jpegBytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) {
                jpegBytes[i] = bin.charCodeAt(i);
            }

            const pageW = 595.28;
            const pageH = 841.89;
            const margin = 40;
            const contentW = pageW - margin * 2;
            const bottomLimit = 46;

            const pages = [];
            let ops = [];
            let cursorY = pageH - margin;

            const startNewPage = () => {
                if (ops.length > 0) pages.push(ops.join('\n'));
                ops = [];
                cursorY = pageH - margin;
            };

            const drawText = (font, size, x, y, text, rgb) => {
                ops.push(`${rgb || '0.059 0.090 0.165'} rg`);
                ops.push(`BT /${font} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm (${sanitizePdfText(text)}) Tj ET`);
            };

            const drawRect = (x, bottomY, w, h, fillRgb, strokeRgb, lineWidth) => {
                if (fillRgb) {
                    ops.push(`${fillRgb} rg`);
                    ops.push(`${x.toFixed(2)} ${bottomY.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
                }
                if (strokeRgb) {
                    ops.push(`${(lineWidth || 0.75).toFixed(2)} w`);
                    ops.push(`${strokeRgb} RG`);
                    ops.push(`${x.toFixed(2)} ${bottomY.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`);
                }
            };

            // Page 1 Header
            drawText('F2', 18, margin, cursorY - 14, routeInfo.title, '0.059 0.090 0.165');
            drawText('F2', 9, pageW - margin - 62, cursorY - 12, 'ROUTECRAFT', '0.392 0.455 0.545');
            cursorY -= 26;

            drawRect(margin, cursorY - 1, 8, 8, hexToRgbPdf(routeInfo.color), '0.392 0.455 0.545', 0.5);
            const metaLine = `Distance: ${routeInfo.distance}   |   Waypoints: ${routeInfo.waypoints.length}   |   Date: ${routeInfo.date}`;
            drawText('F1', 9.5, margin + 13, cursorY, metaLine, '0.278 0.333 0.412');
            cursorY -= 12;

            ops.push('1.2 w 0.059 0.090 0.165 RG');
            ops.push(`${margin} ${cursorY.toFixed(2)} m ${(pageW - margin).toFixed(2)} ${cursorY.toFixed(2)} l S`);
            cursorY -= 14;

            // Map Image Snapshot
            const maxImgW = contentW;
            const maxImgH = 310;
            const aspect = canvas.width / Math.max(1, canvas.height);
            let drawW = maxImgW;
            let drawH = drawW / aspect;
            if (drawH > maxImgH) {
                drawH = maxImgH;
                drawW = drawH * aspect;
            }
            const imgX = margin + (contentW - drawW) / 2;
            const imgBottomY = cursorY - drawH;

            drawRect(imgX - 1, imgBottomY - 1, drawW + 2, drawH + 2, null, '0.796 0.835 0.882', 0.8);
            ops.push(`q ${drawW.toFixed(2)} 0 0 ${drawH.toFixed(2)} ${imgX.toFixed(2)} ${imgBottomY.toFixed(2)} cm /Im1 Do Q`);
            cursorY = imgBottomY - 18;

            // Route Notes
            if (routeInfo.notes) {
                const noteLines = wrapPdfLines(routeInfo.notes, 92);
                const boxH = Math.max(28, noteLines.length * 12.5 + 14);
                if (cursorY - (boxH + 22) < bottomLimit) startNewPage();

                drawText('F2', 9, margin, cursorY, 'ROUTE NOTES', '0.278 0.333 0.412');
                cursorY -= 8;
                drawRect(margin, cursorY - boxH, contentW, boxH, '0.973 0.980 0.988', '0.886 0.910 0.941', 0.7);
                noteLines.forEach((line, idx) => {
                    drawText('F1', 9.2, margin + 8, cursorY - 14 - idx * 12.5, line, '0.067 0.094 0.153');
                });
                cursorY -= boxH + 16;
            }

            // Waypoint Roadbook Table
            const wpColWidths = [28, 152, 130, contentW - 310];
            const drawWpHeader = () => {
                drawRect(margin, cursorY - 20, contentW, 20, '0.945 0.961 0.976', '0.796 0.835 0.882', 0.6);
                let cx = margin;
                ['#', 'Waypoint', 'Coordinates', 'Notes'].forEach((h, i) => {
                    drawText('F2', 8.5, cx + 6, cursorY - 13, h, '0.200 0.255 0.333');
                    cx += wpColWidths[i];
                });
                cursorY -= 20;
            };

            if (cursorY - 46 < bottomLimit) startNewPage();
            drawText('F2', 9, margin, cursorY, 'WAYPOINT ROADBOOK', '0.278 0.333 0.412');
            cursorY -= 8;
            drawWpHeader();

            if (routeInfo.waypoints.length === 0) {
                drawRect(margin, cursorY - 22, contentW, 22, null, '0.796 0.835 0.882', 0.6);
                drawText('F1', 8.8, margin + 6, cursorY - 14, 'No waypoints placed on map.', '0.392 0.455 0.545');
                cursorY -= 32;
            } else {
                routeInfo.waypoints.forEach((wp, idx) => {
                    const iconMeta = getWaypointIconMeta(wp);
                    const rawLabel = wp.label ? wp.label : `Point ${idx + 1}`;
                    const label = iconMeta.id !== 'default' ? `${rawLabel} [${iconMeta.label}]` : rawLabel;
                    const coords = `${Number(wp.lat).toFixed(5)}, ${Number(wp.lng).toFixed(5)}`;
                    const wpNotes = (wp.notes || wp.note || '').trim() || '-';
                    const labelLines = wrapPdfLines(label, 25);
                    const noteLines = wrapPdfLines(wpNotes, 36);
                    const maxLines = Math.max(1, labelLines.length, noteLines.length);
                    const rowH = Math.max(20, maxLines * 11.5 + 9);

                    if (cursorY - rowH < bottomLimit) {
                        startNewPage();
                        drawText('F2', 9, margin, cursorY, 'WAYPOINT ROADBOOK (CONT.)', '0.278 0.333 0.412');
                        cursorY -= 8;
                        drawWpHeader();
                    }

                    let cx = margin;
                    wpColWidths.forEach((w) => {
                        drawRect(cx, cursorY - rowH, w, rowH, null, '0.820 0.855 0.898', 0.5);
                        cx += w;
                    });

                    drawText('F2', 8.5, margin + 8, cursorY - 13, String(idx + 1), '0.059 0.090 0.165');
                    labelLines.forEach((line, lIdx) => {
                        drawText('F1', 8.5, margin + wpColWidths[0] + 6, cursorY - 13 - lIdx * 11.5, line, '0.059 0.090 0.165');
                    });
                    drawText('F1', 8, margin + wpColWidths[0] + wpColWidths[1] + 6, cursorY - 13, coords, '0.278 0.333 0.412');
                    noteLines.forEach((line, nIdx) => {
                        drawText('F1', 8.3, margin + wpColWidths[0] + wpColWidths[1] + wpColWidths[2] + 6, cursorY - 13 - nIdx * 11.5, line, '0.200 0.255 0.333');
                    });

                    cursorY -= rowH;
                });
                cursorY -= 16;
            }

            // Map Text Boxes Table
            if (routeInfo.textBoxes.length > 0) {
                const tbColWidths = [28, 130, contentW - 158];
                const drawTbHeader = () => {
                    drawRect(margin, cursorY - 20, contentW, 20, '0.945 0.961 0.976', '0.796 0.835 0.882', 0.6);
                    let cx = margin;
                    ['#', 'Coordinates', 'Note'].forEach((h, i) => {
                        drawText('F2', 8.5, cx + 6, cursorY - 13, h, '0.200 0.255 0.333');
                        cx += tbColWidths[i];
                    });
                    cursorY -= 20;
                };

                if (cursorY - 46 < bottomLimit) startNewPage();
                drawText('F2', 9, margin, cursorY, 'MAP TEXT BOXES', '0.278 0.333 0.412');
                cursorY -= 8;
                drawTbHeader();

                routeInfo.textBoxes.forEach((tb, idx) => {
                    const coords = `${Number(tb.lat).toFixed(5)}, ${Number(tb.lng).toFixed(5)}`;
                    const noteLines = wrapPdfLines((tb.text || '').trim() || '-', 66);
                    const rowH = Math.max(20, noteLines.length * 11.5 + 9);

                    if (cursorY - rowH < bottomLimit) {
                        startNewPage();
                        drawText('F2', 9, margin, cursorY, 'MAP TEXT BOXES (CONT.)', '0.278 0.333 0.412');
                        cursorY -= 8;
                        drawTbHeader();
                    }

                    let cx = margin;
                    tbColWidths.forEach((w) => {
                        drawRect(cx, cursorY - rowH, w, rowH, null, '0.820 0.855 0.898', 0.5);
                        cx += w;
                    });

                    drawText('F2', 8.5, margin + 8, cursorY - 13, String(idx + 1), '0.059 0.090 0.165');
                    drawText('F1', 8, margin + tbColWidths[0] + 6, cursorY - 13, coords, '0.278 0.333 0.412');
                    noteLines.forEach((line, nIdx) => {
                        drawText('F1', 8.3, margin + tbColWidths[0] + tbColWidths[1] + 6, cursorY - 13 - nIdx * 11.5, line, '0.200 0.255 0.333');
                    });

                    cursorY -= rowH;
                });
            }

            if (ops.length > 0) pages.push(ops.join('\n'));

            // Append footer with page numbers
            const totalPages = pages.length;
            const finalizedStreams = pages.map((pageOps, idx) => {
                const footerLeft = `BT /F1 8 Tf 1 0 0 1 ${margin} 22 Tm (Generated by RouteCraft * Map data (c) OpenStreetMap contributors) Tj ET`;
                const footerRight = `BT /F1 8 Tf 1 0 0 1 ${(pageW - margin - 46).toFixed(2)} 22 Tm (Page ${idx + 1} of ${totalPages}) Tj ET`;
                return `${pageOps}\n0.45 0.50 0.58 rg\n${footerLeft}\n${footerRight}\n`;
            });

            // Assemble PDF binary with exact byte offsets
            const encoder = new TextEncoder();
            const chunks = [];
            let byteOffset = 0;
            const pushStr = (s) => {
                const b = encoder.encode(s);
                chunks.push(b);
                byteOffset += b.length;
            };
            const pushBytes = (b) => {
                chunks.push(b);
                byteOffset += b.length;
            };

            pushStr('%PDF-1.4\n');
            pushBytes(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));

            const offsets = [0]; // 1-indexed object offsets
            const addObject = (id, bodyStr, binaryStream) => {
                offsets[id] = byteOffset;
                pushStr(`${id} 0 obj\n${bodyStr}`);
                if (binaryStream) {
                    pushBytes(binaryStream);
                    pushStr('\nendstream\n');
                }
                pushStr('endobj\n');
            };

            const pageObjIds = finalizedStreams.map((_, i) => 6 + i * 2 + 1);
            addObject(1, '<< /Type /Catalog /Pages 2 0 R >>\n');
            addObject(2, `<< /Type /Pages /Kids [${pageObjIds.map(id => `${id} 0 R`).join(' ')}] /Count ${totalPages} >>\n`);
            addObject(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\n');
            addObject(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\n');
            addObject(
                5,
                `<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`,
                jpegBytes
            );

            finalizedStreams.forEach((streamStr, idx) => {
                const contentId = 6 + idx * 2;
                const pageId = contentId + 1;
                const streamBytes = encoder.encode(streamStr);
                addObject(contentId, `<< /Length ${streamBytes.length} >>\nstream\n`, streamBytes);
                addObject(
                    pageId,
                    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << /Im1 5 0 R >> >> /Contents ${contentId} 0 R >>\n`
                );
            });

            const xrefStart = byteOffset;
            const totalObjs = offsets.length;
            pushStr(`xref\n0 ${totalObjs}\n0000000000 65535 f \n`);
            for (let i = 1; i < totalObjs; i++) {
                pushStr(`${String(offsets[i]).padStart(10, '0')} 00000 n \n`);
            }
            pushStr(`trailer\n<< /Size ${totalObjs} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF\n`);

            return new Blob(chunks, { type: 'application/pdf' });
        }

        function triggerPdfDownload() {
            if (!activePdfDownloadUrl) return;
            const a = document.createElement('a');
            a.href = activePdfDownloadUrl;
            a.download = activePdfFileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast(`Downloaded ${activePdfFileName}`);
        }

        function closePdfPreviewModal() {
            const modal = document.getElementById('pdf-preview-modal');
            if (modal) modal.classList.remove('open');
        }

        function syncMapDomInputsForCapture(mapEl) {
            if (!mapEl) return;
            mapEl.querySelectorAll('.waypoint-map-input').forEach((input) => {
                input.setAttribute('value', input.value || '');
            });
            mapEl.querySelectorAll('.map-textbox-input').forEach((textarea) => {
                textarea.textContent = textarea.value || '';
            });
        }

        function loadImageFromUrl(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = (err) => reject(err);
                img.src = src;
            });
        }

        async function captureMapWithDomToImage(scale) {
            const mapEl = document.getElementById('map');
            if (!mapEl || !window.domtoimage || typeof window.domtoimage.toPng !== 'function') {
                throw new Error('dom-to-image library is not available');
            }

            const rect = mapEl.getBoundingClientRect();
            const width = Math.max(320, Math.round(rect.width));
            const height = Math.max(240, Math.round(rect.height));

            syncMapDomInputsForCapture(mapEl);

            const placeholderPixel = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
            const rawPngUrl = await window.domtoimage.toPng(mapEl, {
                width: width * scale,
                height: height * scale,
                bgcolor: isDarkMode ? '#0b1120' : '#e9eef5',
                quality: 1,
                imagePlaceholder: placeholderPixel,
                style: {
                    transform: `scale(${scale})`,
                    transformOrigin: 'top left',
                    width: `${width}px`,
                    height: `${height}px`,
                    margin: '0',
                    padding: '0'
                },
                filter: (node) => {
                    if (!node || node.nodeType !== 1 || !node.classList) return true;
                    if (
                        node.classList.contains('leaflet-control-zoom') ||
                        node.classList.contains('leaflet-control-layers') ||
                        node.classList.contains('wp-map-del') ||
                        node.classList.contains('map-textbox-del') ||
                        node.classList.contains('waypoint-marker-hidden')
                    ) {
                        return false;
                    }
                    return true;
                }
            });

            if (typeof rawPngUrl !== 'string' || !rawPngUrl.startsWith('data:image/png') || rawPngUrl.length < 2000) {
                throw new Error('Captured PNG was empty');
            }

            const mapImg = await loadImageFromUrl(rawPngUrl);
            const headerHeight = 62;
            const outCanvas = document.createElement('canvas');
            outCanvas.width = width * scale;
            outCanvas.height = (height + headerHeight) * scale;
            const ctx = outCanvas.getContext('2d');
            ctx.scale(scale, scale);

            // Header bar with route metadata for sharing
            const nameInput = document.getElementById('route-name');
            const routeTitle = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'RouteCraft Route';
            const distText = currentWaypoints.length >= 2
                ? formatDistancePair(currentRouteDistanceMeters, ' / ')
                : '0.0 km / 0.0 mi';

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, headerHeight);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, headerHeight - 0.5);
            ctx.lineTo(width, headerHeight - 0.5);
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(routeTitle, 14, 26, Math.max(120, width - 170));

            ctx.fillStyle = '#475569';
            ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${distText}  ·  ${currentWaypoints.length} Waypoint${currentWaypoints.length === 1 ? '' : 's'}`, 14, 46);

            ctx.fillStyle = '#64748b';
            ctx.font = '700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('ROUTECRAFT', width - 14, 25);
            ctx.textAlign = 'left';

            ctx.drawImage(mapImg, 0, headerHeight, width, height);
            return outCanvas;
        }

            if (!activePngDownloadUrl) return;
            const a = document.createElement('a');
            a.href = activePngDownloadUrl;
            a.download = activePngFileName;
            document.body.appendChild(a);
            a.click();

            showToast(`Exported ${activePngFileName}`);

            if (!activePngBlob || !navigator.clipboard || typeof navigator.clipboard.write !== 'function' || typeof ClipboardItem === 'undefined') {
                showToast('Clipboard image copy is not supported here — use Download PNG.');
                return;
            }
            try {
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': activePngBlob })
                ]);
                showToast('High-res PNG copied to clipboard');
            } catch (err) {
                console.warn('Clipboard copy failed:', err);

        async function sharePngFile() {
            if (!activePngBlob || !navigator.share) return;
            try {
                const file = new File([activePngBlob], activePngFileName, { type: 'image/png' });
                const nameInput = document.getElementById('route-name');
                const routeTitle = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'RouteCraft Route';
                if (navigator.canShare && !navigator.canShare({ files: [file] })) {
                    showToast('Direct file sharing not supported on this browser.');
                    return;
                }
                await navigator.share({
                    title: routeTitle,
                    text: `${routeTitle} (${currentWaypoints.length} waypoints)`,
                    files: [file]
                });
            } catch (err) {
                if (err && err.name !== 'AbortError') {
                    showToast('Share cancelled or unavailable.');
                }
            }
        }

            try {
                const scale = Math.max(2, Math.min(3, Math.ceil(window.devicePixelRatio || 2)));
                let canvas;
                try {
                    canvas = await captureMapWithDomToImage(scale);
                } catch (domErr) {
                    console.warn('dom-to-image capture fallback triggered:', domErr);
                    canvas = await renderSafeExportCanvas(true);
                }

                const nameInput = document.getElementById('route-name');
                const routeTitle = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : 'RouteCraft Route';
                const baseName = (nameInput && nameInput.value.trim())
                    ? nameInput.value.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'routecraft_map'
                    : 'routecraft_map';
                activePngFileName = `${baseName}.png`;

                const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));

                if (activePngDownloadUrl) {
                    URL.revokeObjectURL(activePngDownloadUrl);

                if (shareBtn) {
