    <!-- Leaflet JS & Routing Engine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        let map = null;
        let routeLayerGroup = null;
        let routePolylineLayers = [];
        let routeRequestSeq = 0;
        let currentWaypoints = []; // { lat, lng, label, notes, icon }
        let currentTextBoxes = []; // { id, lat, lng, text }
        let currentRouteGeometry = [];
        let currentRouteDistanceMeters = 0;
        const DEFAULT_ROUTE_COLOR = '#2b8ed6';
        let currentRouteColor = DEFAULT_ROUTE_COLOR;

        const WAYPOINT_ICONS = {
            default: {
                id: 'default',
                label: 'Waypoint',
                emoji: '📍',
                gpxSym: 'Flag, Blue',
                gpxType: 'waypoint',
                gpxIcon: 'pin-waypoint',
                color: '#2b8ed6',
                garminColor: 'Blue'
            },
            start: {
                id: 'start',
                label: 'Start',
                emoji: '🟢',
                gpxSym: 'Flag, Green',
                gpxType: 'start',
                gpxIcon: 'flag-start',
                color: '#16a34a',
                garminColor: 'Green'
            },
            control: {
                id: 'control',
                label: 'Control',
                emoji: '⏱️',
                gpxSym: 'Control Point',
                gpxType: 'control',
                gpxIcon: 'control',
                color: '#7c3aed',
                garminColor: 'Magenta'
            },
            finish: {
                id: 'finish',
                label: 'Finish',
                emoji: '🏁',
                gpxSym: 'Flag, Red',
                gpxType: 'finish',
                gpxIcon: 'flag-finish',
                color: '#dc2626',
                garminColor: 'Red'
            },
            hazard: {
                id: 'hazard',
                label: 'Caution',
                emoji: '⚠️',
                gpxSym: 'Danger Area',
                gpxType: 'hazard',
                gpxIcon: 'caution',
                color: '#d97706',
                garminColor: 'DarkYellow'
            },
            fuel: {
                id: 'fuel',
                label: 'Fuel / Stop',
                emoji: '⛽',
                gpxSym: 'Gas Station',
                gpxType: 'fuel',
                gpxIcon: 'fuel',
                color: '#0891b2',
                garminColor: 'Cyan'
            },
            viewpoint: {
                id: 'viewpoint',
                label: 'Scenic / POI',
                emoji: '📷',
                gpxSym: 'Scenic Area',
                gpxType: 'scenic',
                gpxIcon: 'viewpoint',
                color: '#059669',
                garminColor: 'DarkGreen'
            }
        };

        function normalizeWaypointIconId(iconId) {
            if (typeof iconId === 'string') {
                const key = iconId.trim().toLowerCase();
                if (Object.prototype.hasOwnProperty.call(WAYPOINT_ICONS, key)) {
                    return key;
                }
            }
            return 'default';
        }

        function getWaypointIconMeta(wp) {
            const key = normalizeWaypointIconId(wp && wp.icon);
            return WAYPOINT_ICONS[key] || WAYPOINT_ICONS.default;
        }

        function inferWaypointIconFromGpx(wptEl) {
            if (!wptEl) return 'default';
            const getText = (sel) => {
                const el = wptEl.querySelector(sel);
                return el && el.textContent ? el.textContent.trim().toLowerCase() : '';
            };
            const extIcon = getText('extensions > icon, icon');
            const extLabel = getText('extensions > iconLabel, iconLabel');
            const typeTxt = getText('type');
            const symTxt = getText('sym');
            const combined = [extIcon, extLabel, typeTxt, symTxt].filter(Boolean).join(' ');

            if (WAYPOINT_ICONS[extIcon]) return extIcon;
            if (extIcon === 'flag-start' || typeTxt === 'start' || symTxt === 'flag, green') return 'start';
            if (extIcon === 'flag-finish' || typeTxt === 'finish' || symTxt === 'flag, red') return 'finish';
            if (extIcon === 'control' || typeTxt === 'control' || combined.includes('control')) return 'control';
            if (extIcon === 'caution' || typeTxt === 'hazard' || combined.includes('danger') || combined.includes('caution')) return 'hazard';
            if (extIcon === 'fuel' || typeTxt === 'fuel' || combined.includes('gas') || combined.includes('fuel')) return 'fuel';
            if (extIcon === 'viewpoint' || typeTxt === 'scenic' || combined.includes('scenic') || combined.includes('viewpoint')) return 'viewpoint';
            return 'default';
        }
        let waypointMarkers = [];
        let textBoxMarkers = [];
        let memoryStorage = [];
        let isPlacingTextBox = false;
        let editingRouteId = null;
        let toastTimer = null;
        let suppressMapClickUntil = 0;
        let isDraggingMarker = false;
        let activePdfDownloadUrl = null;
        let activePdfFileName = 'routecraft_route.pdf';
        let activePngDownloadUrl = null;
        let activePngBlob = null;
        let activePngFileName = 'routecraft_map.png';
        const MAX_HISTORY_ENTRIES = 50;
        let historyStack = [];
        let historyIndex = -1;
        let historyInputTimer = null;
        let isRestoringHistory = false;
        let activeMapStyle = 'landranger';
        let lastLightMapStyle = 'landranger';
        let isDarkMode = false;
        const THEME_STORAGE_KEY = 'routecraft_theme';
        let baseTileLayers = {};
        let osgbGridLayer = null;
        let isOsGridEnabled = true;
        let isRoadSnapEnabled = true;
        let hideUnnamedShapingPoints = true;
        const HIDE_SHAPING_STORAGE_KEY = 'routecraft_hide_unnamed_shaping';
        let currentRoutingMode = 'rally'; // 'rally' | 'roads' | 'direct'
        const VALHALLA_ROUTE_URL = 'https://valhalla1.openstreetmap.de/route';
        const VALHALLA_LOCATE_URL = 'https://valhalla1.openstreetmap.de/locate';
        const ROUTING_MODE_CONFIGS = {
            rally: {
                id: 'rally',
                label: 'Rally / Stage Roads',
                routeUrl: VALHALLA_ROUTE_URL,
                locateUrl: VALHALLA_LOCATE_URL,
                costing: 'auto',
                autoOptions: {
                    ignore_access: true,
                    ignore_closures: true,
                    private_access_penalty: 0,
                    use_tracks: 0.15
                },
                searchFilter: {
                    min_road_class: 'service_other',
                    max_road_class: 'motorway'
                }
            },
            roads: {
                id: 'roads',
                label: 'Public Roads (Car)',
                routeUrl: VALHALLA_ROUTE_URL,
                locateUrl: VALHALLA_LOCATE_URL,
                costing: 'auto',
                autoOptions: {
                    use_tracks: 0
                },
                searchFilter: {
                    min_road_class: 'service_other',
                    max_road_class: 'motorway'
                }
            },
            direct: {
                id: 'direct',
                label: 'Direct (Exact)',
                routeUrl: '',
                locateUrl: '',
                costing: 'direct',
                autoOptions: null,
                searchFilter: null
            }
        };
        let activeRouterMode = null;
        let elevationHoverMarker = null;
        let elevationProfileData = [];
        let elevationWaypointMarks = [];
        let elevationRequestSeq = 0;
        let isElevationCollapsed = false;
        const elevationPointCache = new Map();
        const AUTOSAVE_STORAGE_KEY = 'routecraft_autosave_draft';
        const AUTOSAVE_INTERVAL_MS = 5000;
        let autoSaveDebounceTimer = null;
        let autoSaveIntervalId = null;
        let isRestoringAutoSave = false;

        function showToast(message) {
            const el = document.getElementById('toast-banner');
            if (!el) return;
            el.textContent = message;
            el.classList.add('visible');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('visible');
            }, 2600);
        }

        function getSavedDrives() {
            try {
                const raw = localStorage.getItem('saved_drives');
                return raw ? JSON.parse(raw) : memoryStorage;
            } catch (e) {
                return memoryStorage;
            }
        }

        function setSavedDrives(drives) {
            memoryStorage = drives;
            try {
                localStorage.setItem('saved_drives', JSON.stringify(drives));
            } catch (e) {
                console.warn('LocalStorage blocked; stored in session memory instead.');
            }
        }

        function buildWorkingDraftPayload() {
            const nameInput = document.getElementById('route-name');
            const notesInput = document.getElementById('route-notes');
            const name = nameInput ? nameInput.value : '';
            const notes = notesInput ? notesInput.value : '';

            let mapView = null;
            if (map && typeof map.getCenter === 'function' && typeof map.getZoom === 'function') {
                const center = map.getCenter();
                mapView = {
                    center: [Number(center.lat), Number(center.lng)],
                    zoom: Number(map.getZoom())
                };
            }

            return {
                version: 1,
                engine: 'valhalla',
                name,
                notes,
                color: currentRouteColor,
                routingMode: currentRoutingMode,
                roadSnap: isRoadSnapEnabled,
                hideShapingPoints: hideUnnamedShapingPoints,
                distanceMeters: Number(currentRouteDistanceMeters) || 0,
                waypoints: currentWaypoints.map(wp => ({
                    lat: Number(wp.lat),
                    lng: Number(wp.lng),
                    label: wp.label || '',
                    notes: wp.notes || wp.note || '',
                    icon: normalizeWaypointIconId(wp.icon),
                    direct: Boolean(wp.direct)
                })),
                textBoxes: currentTextBoxes.map(tb => ({
                    id: tb.id,
                    lat: Number(tb.lat),
                    lng: Number(tb.lng),
                    text: tb.text || ''
                })),
                geometry: Array.isArray(currentRouteGeometry)
                    ? currentRouteGeometry.map(pt => ({ lat: Number(pt.lat), lng: Number(pt.lng) }))
                    : [],
                mapView,
                updatedAt: new Date().toISOString()
            };
        }

        function hasWorkingRouteContent(draft) {
            if (!draft) return false;
            const hasWps = Array.isArray(draft.waypoints) && draft.waypoints.length > 0;
            const hasTbs = Array.isArray(draft.textBoxes) && draft.textBoxes.length > 0;
            const hasName = typeof draft.name === 'string' && draft.name.trim().length > 0;
            const hasNotes = typeof draft.notes === 'string' && draft.notes.trim().length > 0;
            return hasWps || hasTbs || hasName || hasNotes;
        }

        function clearAutoSaveDraft() {
            if (autoSaveDebounceTimer) {
                clearTimeout(autoSaveDebounceTimer);
                autoSaveDebounceTimer = null;
            }
            try {
                localStorage.removeItem(AUTOSAVE_STORAGE_KEY);
            } catch (e) {}
        }

        function saveWorkingDraftNow() {
            if (isRestoringAutoSave || !map) return;
            const draft = buildWorkingDraftPayload();
            if (!hasWorkingRouteContent(draft)) {
                clearAutoSaveDraft();
                return;
            }
            try {
                localStorage.setItem(AUTOSAVE_STORAGE_KEY, JSON.stringify(draft));
            } catch (e) {
                // Retry without dense geometry if localStorage quota is tight
                try {
                    const compactDraft = { ...draft, geometry: [] };
                    localStorage.setItem(AUTOSAVE_STORAGE_KEY, JSON.stringify(compactDraft));
                } catch (err) {
                    console.warn('Auto-save skipped; localStorage unavailable.', err);
                }
            }
        }

        function scheduleAutoSave(delayMs) {
            if (isRestoringAutoSave) return;
            if (autoSaveDebounceTimer) {
                clearTimeout(autoSaveDebounceTimer);
            }
            autoSaveDebounceTimer = setTimeout(() => {
                autoSaveDebounceTimer = null;
                saveWorkingDraftNow();
            }, typeof delayMs === 'number' ? delayMs : 600);
        }

        function restoreAutoSavedDraft() {
            let raw = null;
            try {
                raw = localStorage.getItem(AUTOSAVE_STORAGE_KEY);
            } catch (e) {
                return false;
            }
            if (!raw) return false;

            let draft = null;
            try {
                draft = JSON.parse(raw);
            } catch (e) {
                return false;
            }

            if (!hasWorkingRouteContent(draft)) {
                clearAutoSaveDraft();
                return false;
            }

            isRestoringAutoSave = true;
            try {
                const nameInput = document.getElementById('route-name');
                const notesInput = document.getElementById('route-notes');
                if (nameInput) nameInput.value = typeof draft.name === 'string' ? draft.name : '';
                if (notesInput) notesInput.value = typeof draft.notes === 'string' ? draft.notes : '';

                currentWaypoints = Array.isArray(draft.waypoints)
                    ? draft.waypoints
                        .map(w => ({
                            lat: Number(w.lat),
                            lng: Number(w.lng),
                            label: w.label || '',
                            notes: w.notes || w.note || '',
                            icon: normalizeWaypointIconId(w.icon),
                            direct: Boolean(w.direct)
                        }))
                        .filter(w => isFinite(w.lat) && isFinite(w.lng))
                    : [];

                if (draft.routingMode) {
                    setRoutingMode(normalizeRoutingMode(draft.routingMode), { skipRecalc: true, silent: true });
                }
                if (typeof draft.roadSnap === 'boolean') {
                    setRoadSnapEnabled(draft.roadSnap, { skipRecalc: true, silent: true });
                }
                if (typeof draft.hideShapingPoints === 'boolean') {
                    setHideUnnamedShapingPoints(draft.hideShapingPoints, { silent: true, skipPersist: true });
                }

                currentTextBoxes = Array.isArray(draft.textBoxes)
                    ? draft.textBoxes
                        .map((tb, idx) => ({
                            id: tb.id || ('tb_' + Date.now() + '_' + idx),
                            lat: Number(tb.lat),
                            lng: Number(tb.lng),
                            text: tb.text || ''
                        }))
                        .filter(tb => isFinite(tb.lat) && isFinite(tb.lng))
                    : [];

                currentRouteGeometry = Array.isArray(draft.geometry)
                    ? draft.geometry
                        .map(pt => ({ lat: Number(pt.lat), lng: Number(pt.lng) }))
                        .filter(pt => isFinite(pt.lat) && isFinite(pt.lng))
                    : [];

                currentRouteDistanceMeters = typeof draft.distanceMeters === 'number' && draft.distanceMeters > 0
                    ? draft.distanceMeters
                    : calculatePolylineDistanceMeters(currentRouteGeometry.length > 1 ? currentRouteGeometry : currentWaypoints);

                applyRouteColorToMap(draft.color || DEFAULT_ROUTE_COLOR);
                syncMarkersToWaypoints();
                syncTextBoxMarkers(false);
                initRouting();

                if (draft.mapView && Array.isArray(draft.mapView.center) && draft.mapView.center.length === 2 && isFinite(draft.mapView.zoom)) {
                    map.setView([Number(draft.mapView.center[0]), Number(draft.mapView.center[1])], Number(draft.mapView.zoom), { animate: false });
                } else {
                    const allCoords = [
                        ...currentWaypoints.map(w => L.latLng(w.lat, w.lng)),
                        ...currentTextBoxes.map(tb => L.latLng(tb.lat, tb.lng))
                    ];
                    if (allCoords.length > 0) {
                        map.fitBounds(L.latLngBounds(allCoords), { padding: [50, 50] });
                    }
                }

                historyStack = [];
                historyIndex = -1;
                recordHistoryState();

                const needsValhallaRecalc = draft.engine !== 'valhalla' && currentRoutingMode !== 'direct';
                if (!needsValhallaRecalc && currentRouteGeometry.length >= 2 && currentWaypoints.length >= 2) {
                    const isFallbackLine = areWaypointCoordsEqual(currentRouteGeometry, currentWaypoints);
                    drawRouteLines(currentRouteGeometry, currentWaypoints, isFallbackLine);
                    updateRouteDistanceDisplay(isFallbackLine ? `~${formatDistance(currentRouteDistanceMeters)}` : undefined);
                    refreshElevationProfile();
                } else if (currentWaypoints.length >= 1) {
                    updateRoutingWaypoints();
                } else {
                    updateRouteDistanceDisplay();
                    refreshElevationProfile();
                }

                showToast('Restored auto-saved route draft');
                return true;
            } finally {
                isRestoringAutoSave = false;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        function measureInputWidth(text, placeholder) {
            const sample = (text && text.length > 0) ? text : (placeholder || 'Point 1');
            const px = Math.min(180, Math.max(54, sample.length * 7.5 + 18));
            return px + 'px';
        }

        function autoResizeTextarea(textarea) {
            if (!textarea) return;
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(140, Math.max(46, textarea.scrollHeight)) + 'px';
        }

        function bindMarkerRootIsolation(el) {
            if (!el) return;
            // Only stop click/dblclick bubbling so Leaflet Draggable still receives
            // document-level mouseup / pointerup / touchend to finish drags cleanly.
            ['click', 'dblclick'].forEach(evt => {
                el.addEventListener(evt, (e) => {
                    e.stopPropagation();
                    suppressMapClickUntil = Date.now() + 450;
                });
            });
        }

        function bindMarkerInputIsolation(inputEl) {
            if (!inputEl) return;
            ['mousedown', 'pointerdown', 'touchstart', 'click', 'dblclick'].forEach(evt => {
                inputEl.addEventListener(evt, (e) => {
                    e.stopPropagation();
                    suppressMapClickUntil = Date.now() + 500;
                });
            });
        }

        function bindMarkerDeleteButton(btn, onDelete) {
            if (!btn) return;
            let handled = false;

            const triggerDelete = (e) => {
                e.preventDefault();
                e.stopPropagation();
                suppressMapClickUntil = Date.now() + 800;
                if (handled) return;
                handled = true;
                setTimeout(() => { handled = false; }, 450);
                onDelete();
            };

            ['mousedown', 'mouseup', 'pointerdown', 'pointerup', 'touchstart'].forEach(evt => {
                btn.addEventListener(evt, (e) => {
                    e.stopPropagation();
                    suppressMapClickUntil = Date.now() + 800;
                });
            });

            btn.addEventListener('touchend', triggerDelete);
            btn.addEventListener('click', triggerDelete);
        }

        function getModeHintText() {
            if (isPlacingTextBox) {
                return 'Tap anywhere on the map to drop an editable text box.';
            }
            if (currentRoutingMode === 'direct') {
                return 'Direct mode: tap map to place exact waypoints connected by straight lines.';
            }
            if (currentRoutingMode === 'roads') {
                return isRoadSnapEnabled
                    ? 'Public Roads (Car): Valhalla car routing on unrestricted public roads.'
                    : 'Public Roads (no marker snap): markers stay at your exact taps.';
            }
            return isRoadSnapEnabled
                ? 'Rally / Stage Roads (Valhalla): follows tarmac, private/MOD & forestry stage roads.'
                : 'Rally / Stage Roads (no marker snap): markers stay at your exact taps.';
        }

        function setTextBoxPlacementMode(active) {
            isPlacingTextBox = active;
            const btn = document.getElementById('add-textbox-btn');
            const mapEl = document.getElementById('map');
            const hintEl = document.getElementById('mode-hint');

            if (btn) {
                btn.classList.toggle('active-mode', active);
                btn.textContent = active ? 'Cancel Text Box' : '+ Text Box';
            }
            if (mapEl) {
                mapEl.classList.toggle('placing-textbox', active);
            }
            if (hintEl) {
                hintEl.textContent = getModeHintText();
            }
        }

        function calculatePolylineDistanceMeters(points) {
            if (!Array.isArray(points) || points.length < 2) return 0;
            let total = 0;
            for (let i = 1; i < points.length; i++) {
                const prev = L.latLng(points[i - 1].lat, points[i - 1].lng);
                const curr = L.latLng(points[i].lat, points[i].lng);
                total += prev.distanceTo(curr);
            }
            return total;
        }

        function formatDistancePair(meters, separator) {
            const sep = separator || ' / ';
            if (!meters || meters <= 0) return `0.0 km${sep}0.0 mi`;
            const km = meters / 1000;
            const miles = meters / 1609.344;
            if (meters < 1000) {
                return `${Math.round(meters)} m${sep}${miles.toFixed(2)} mi`;
            }
            return `${km.toFixed(1)} km${sep}${miles.toFixed(1)} mi`;
        }

        function formatDistance(meters) {
            if (!meters || meters <= 0) return '0.0 km (0.0 mi)';
            const km = meters / 1000;
            const miles = meters / 1609.344;
            if (meters < 1000) {
                return `${Math.round(meters)} m (${miles.toFixed(2)} mi)`;
            }
            return `${km.toFixed(1)} km (${miles.toFixed(1)} mi)`;
        }

        function updateRouteSummaryWaypoints() {
            const wpEl = document.getElementById('summary-waypoints');
            if (wpEl) {
                wpEl.textContent = String(currentWaypoints.length);
            }
        }

        function updateRouteDistanceDisplay(statusText) {
            const el = document.getElementById('route-distance-display');
            const summaryDistEl = document.getElementById('summary-distance');
            updateRouteSummaryWaypoints();

            let displayLabel = '';
            let summaryLabel = '';

            if (statusText) {
                displayLabel = statusText;
                summaryLabel = statusText;
            } else if (currentWaypoints.length < 2) {
                displayLabel = '0.0 km';
                summaryLabel = '0.0 km / 0.0 mi';
            } else {
                displayLabel = formatDistance(currentRouteDistanceMeters);
                summaryLabel = formatDistancePair(currentRouteDistanceMeters, ' / ');
            }

            if (el) el.textContent = displayLabel;
            if (summaryDistEl) summaryDistEl.textContent = summaryLabel;
        }

        function applyRouteColorToMap(color) {
            const safeColor = /^#[0-9a-fA-F]{6}$/.test(color) ? color : DEFAULT_ROUTE_COLOR;
            currentRouteColor = safeColor;

            const picker = document.getElementById('route-color-picker');
            const hexLabel = document.getElementById('route-color-hex');
            if (picker && picker.value.toLowerCase() !== safeColor.toLowerCase()) {
                picker.value = safeColor;
            }
            if (hexLabel) {
                hexLabel.textContent = safeColor.toUpperCase();
            }

            routePolylineLayers.forEach((layer) => {
                if (layer && typeof layer.setStyle === 'function') {
                    layer.setStyle({ color: safeColor });
                }
            });
            scheduleAutoSave(400);
        }

        function normalizeRoutingMode(mode) {
            return Object.prototype.hasOwnProperty.call(ROUTING_MODE_CONFIGS, mode) ? mode : 'rally';
        }

        function getActiveRoutingConfig() {
            return ROUTING_MODE_CONFIGS[currentRoutingMode] || ROUTING_MODE_CONFIGS.rally;
        }

        function getRoadSnapMaxMeters() {
            if (!map) return 120;
            const center = map.getCenter();
            const zoom = map.getZoom();
            const metersPerPixel = (156543.03392 * Math.cos((center.lat * Math.PI) / 180)) / Math.pow(2, zoom);
            return Math.max(40, Math.min(180, Math.round(metersPerPixel * 18)));
        }

        function setRoutingMode(mode, options) {
            const opts = options || {};
            const nextMode = normalizeRoutingMode(mode);
            currentRoutingMode = nextMode;

            const select = document.getElementById('routing-mode-select');
            if (select && select.value !== nextMode) {
                select.value = nextMode;
            }
            const toggle = document.getElementById('snap-roads-toggle');
            const toggleLabel = document.getElementById('snap-toggle-label');
            const isDirect = nextMode === 'direct';
            if (toggle) {
                toggle.disabled = isDirect;
            }
            if (toggleLabel) {
                toggleLabel.classList.toggle('is-disabled', isDirect);
            }
            if (!isPlacingTextBox) {
                setTextBoxPlacementMode(false);
            }

            initRouting(true);

            if (!opts.skipRecalc && currentWaypoints.length > 0) {
                updateRoutingWaypoints();
            }
            if (!opts.silent) {
                showToast(`Routing mode: ${getActiveRoutingConfig().label}`);
            }
            scheduleAutoSave(400);
        }

        function setRoadSnapEnabled(enabled, options) {
            const opts = options || {};
            isRoadSnapEnabled = Boolean(enabled);
            const toggle = document.getElementById('snap-roads-toggle');
            if (toggle && toggle.checked !== isRoadSnapEnabled) {
                toggle.checked = isRoadSnapEnabled;
            }
            if (!isPlacingTextBox) {
                setTextBoxPlacementMode(false);
            }
            if (!opts.skipRecalc && isRoadSnapEnabled && currentRoutingMode !== 'direct' && currentWaypoints.length > 0) {
                updateRoutingWaypoints();
            }
            if (!opts.silent) {
                showToast(isRoadSnapEnabled ? 'Waypoint snapping enabled' : 'Waypoint snapping disabled — exact points kept');
            }
            scheduleAutoSave(400);
        }

        function isUnnamedShapingPoint(wp) {
            if (!wp) return false;
            const hasLabel = typeof wp.label === 'string' && wp.label.trim().length > 0;
            const iconId = normalizeWaypointIconId(wp.icon);
            return !hasLabel && iconId === 'default';
        }

        function updateWaypointMarkerVisibility(index) {
            const marker = waypointMarkers[index];
            const wp = currentWaypoints[index];
            const el = marker && typeof marker.getElement === 'function' ? marker.getElement() : null;
            if (!el) return;
            const shouldHide = Boolean(hideUnnamedShapingPoints && wp && isUnnamedShapingPoint(wp));
            el.classList.toggle('waypoint-marker-hidden', shouldHide);
            if (shouldHide) {
                el.setAttribute('aria-hidden', 'true');
            } else {
                el.removeAttribute('aria-hidden');
            }
        }

        function refreshAllWaypointMarkerVisibility() {
            waypointMarkers.forEach((_, idx) => updateWaypointMarkerVisibility(idx));
        }

        function setHideUnnamedShapingPoints(enabled, options) {
            const opts = options || {};
            hideUnnamedShapingPoints = Boolean(enabled);
            const toggle = document.getElementById('hide-shaping-toggle');
            if (toggle && toggle.checked !== hideUnnamedShapingPoints) {
                toggle.checked = hideUnnamedShapingPoints;
            }
            if (!opts.skipPersist) {
                try {
                    localStorage.setItem(HIDE_SHAPING_STORAGE_KEY, hideUnnamedShapingPoints ? '1' : '0');
                } catch (e) {}
            }
            refreshAllWaypointMarkerVisibility();
            if (!opts.silent) {
                showToast(hideUnnamedShapingPoints
                    ? 'Hiding unnamed shaping points on map'
                    : 'Showing all waypoint markers on map');
            }
            scheduleAutoSave(400);
        }

        function initRouting(forceReset) {
            if (!routeLayerGroup && map) {
                routeLayerGroup = L.layerGroup().addTo(map);
            }
            const cfg = getActiveRoutingConfig();
            if (cfg.id === 'direct') {
                activeRouterMode = 'direct';
                return;
            }
            if (forceReset || activeRouterMode !== cfg.id) {
                activeRouterMode = cfg.id;
            }
        }

        function drawRouteLines(routeCoords, waypoints, isPreview) {
            initRouting();
            if (!routeLayerGroup) return;
            routeLayerGroup.clearLayers();
            routePolylineLayers = [];

            if (!Array.isArray(routeCoords) || routeCoords.length < 2) return;

            const latLngs = routeCoords.map(pt => L.latLng(pt.lat, pt.lng));

            // White casing
            L.polyline(latLngs, {
                color: '#ffffff',
                opacity: isPreview ? 0.75 : 0.9,
                weight: isPreview ? 7 : 8,
                lineCap: 'round',
                lineJoin: 'round',
                interactive: false
            }).addTo(routeLayerGroup);

            // Colored route stroke
            const mainLine = L.polyline(latLngs, {
                color: currentRouteColor,
                opacity: isPreview ? 0.7 : 0.95,
                weight: isPreview ? 4 : 5,
                dashArray: isPreview ? '8, 8' : null,
                lineCap: 'round',
                lineJoin: 'round',
                interactive: false
            }).addTo(routeLayerGroup);
            routePolylineLayers.push(mainLine);

            // If a saved/imported route has endpoints slightly detached from markers, connect cleanly
            if (!isPreview && Array.isArray(waypoints) && waypoints.length >= 2) {
                const startWp = L.latLng(waypoints[0].lat, waypoints[0].lng);
                const endWp = L.latLng(waypoints[waypoints.length - 1].lat, waypoints[waypoints.length - 1].lng);
                const firstRoutePt = latLngs[0];
                const lastRoutePt = latLngs[latLngs.length - 1];

                if (startWp.distanceTo(firstRoutePt) > 12) {
                    const startConn = L.polyline([startWp, firstRoutePt], {
                        color: currentRouteColor,
                        opacity: 0.95,
                        weight: 4.5,
                        lineCap: 'round',
                        interactive: false
                    }).addTo(routeLayerGroup);
                    routePolylineLayers.push(startConn);
                }

                if (endWp.distanceTo(lastRoutePt) > 12) {
                    const endConn = L.polyline([lastRoutePt, endWp], {
                        color: currentRouteColor,
                        opacity: 0.95,
                        weight: 4.5,
                        lineCap: 'round',
                        interactive: false
                    }).addTo(routeLayerGroup);
                    routePolylineLayers.push(endConn);
                }
            }
        }

        function renderPreviewRoutePolyline() {
            if (currentWaypoints.length < 2) {
                if (routeLayerGroup) routeLayerGroup.clearLayers();
                routePolylineLayers = [];
                return;
            }
            drawRouteLines(currentWaypoints, currentWaypoints, true);
        }

        function cloneRouteSnapshot() {
            return {
                waypoints: currentWaypoints.map(wp => ({
                    lat: Number(wp.lat),
                    lng: Number(wp.lng),
                    label: wp.label || '',
                    notes: wp.notes || wp.note || '',
                    icon: normalizeWaypointIconId(wp.icon),
                    direct: Boolean(wp.direct)
                })),
                geometry: Array.isArray(currentRouteGeometry)
                    ? currentRouteGeometry.map(pt => ({ lat: Number(pt.lat), lng: Number(pt.lng) }))
                    : [],
                distanceMeters: Number(currentRouteDistanceMeters) || 0,
                routingMode: currentRoutingMode
            };
        }

        function areWaypointCoordsEqual(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (Number(a[i].lat) !== Number(b[i].lat) || Number(a[i].lng) !== Number(b[i].lng)) {
                    return false;
                }
            }
            return true;
        }

        function areSnapshotsEqual(a, b) {
            if (!a || !b) return false;
            if (a.distanceMeters !== b.distanceMeters) return false;
            if ((a.routingMode || 'rally') !== (b.routingMode || 'rally')) return false;
            if (a.waypoints.length !== b.waypoints.length) return false;
            if (a.geometry.length !== b.geometry.length) return false;
            for (let i = 0; i < a.waypoints.length; i++) {
                const wa = a.waypoints[i];
                const wb = b.waypoints[i];
                if (
                    wa.lat !== wb.lat ||
                    wa.lng !== wb.lng ||
                    wa.label !== wb.label ||
                    wa.notes !== wb.notes ||
                    Boolean(wa.direct) !== Boolean(wb.direct) ||
                    normalizeWaypointIconId(wa.icon) !== normalizeWaypointIconId(wb.icon)
                ) {
                    return false;
                }
            }
            for (let i = 0; i < a.geometry.length; i++) {
                if (a.geometry[i].lat !== b.geometry[i].lat || a.geometry[i].lng !== b.geometry[i].lng) {
                    return false;
                }
            }
            return true;
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('undo-btn');
            const redoBtn = document.getElementById('redo-btn');
            if (undoBtn) undoBtn.disabled = historyIndex <= 0;
            if (redoBtn) redoBtn.disabled = historyIndex < 0 || historyIndex >= historyStack.length - 1;
        }

        function clearPendingHistoryCommit() {
            if (historyInputTimer) {
                clearTimeout(historyInputTimer);
                historyInputTimer = null;
            }
        }

        function recordHistoryState() {
            if (isRestoringHistory) return;
            clearPendingHistoryCommit();
            const snap = cloneRouteSnapshot();
            const currentHead = historyIndex >= 0 ? historyStack[historyIndex] : null;
            if (currentHead && areSnapshotsEqual(currentHead, snap)) {
                updateUndoRedoButtons();
                return;
            }
            if (historyIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            }
            historyStack.push(snap);
            if (historyStack.length > MAX_HISTORY_ENTRIES) {
                historyStack.shift();
            }
            historyIndex = historyStack.length - 1;
            updateUndoRedoButtons();
            scheduleAutoSave(450);
        }

        function scheduleHistoryCommit() {
            if (isRestoringHistory) return;
            clearPendingHistoryCommit();
            historyInputTimer = setTimeout(() => {
                historyInputTimer = null;
                recordHistoryState();
            }, 450);
            scheduleAutoSave(550);
        }

        function syncCurrentHistoryGeometry(targetIndex, syncSnappedCoords) {
            const geomCopy = Array.isArray(currentRouteGeometry)
                ? currentRouteGeometry.map(pt => ({ lat: Number(pt.lat), lng: Number(pt.lng) }))
                : [];
            const dist = Number(currentRouteDistanceMeters) || 0;
            const wpCopy = currentWaypoints.map(wp => ({
                lat: Number(wp.lat),
                lng: Number(wp.lng),
                label: wp.label || '',
                notes: wp.notes || wp.note || '',
                icon: normalizeWaypointIconId(wp.icon),
                direct: Boolean(wp.direct)
            }));
            const shouldSyncEntry = (entry) => {
                if (!entry) return false;
                if (areWaypointCoordsEqual(entry.waypoints, currentWaypoints)) return true;
                return Boolean(syncSnappedCoords && Array.isArray(entry.waypoints) && entry.waypoints.length === currentWaypoints.length);
            };

            const entry = (targetIndex >= 0 && targetIndex < historyStack.length) ? historyStack[targetIndex] : null;
            if (shouldSyncEntry(entry)) {
                if (syncSnappedCoords) {
                    entry.waypoints = wpCopy.map(w => ({ ...w }));
                }
                entry.geometry = geomCopy;
                entry.distanceMeters = dist;
            }
            const head = (historyIndex >= 0 && historyIndex < historyStack.length) ? historyStack[historyIndex] : null;
            if (head && head !== entry && shouldSyncEntry(head)) {
                if (syncSnappedCoords) {
                    head.waypoints = wpCopy.map(w => ({ ...w }));
                }
                head.geometry = geomCopy.map(pt => ({ lat: pt.lat, lng: pt.lng }));
                head.distanceMeters = dist;
            }
            scheduleAutoSave(400);
        }

        function applyHistorySnapshot(snap) {
            if (!snap) return;
            isRestoringHistory = true;
            clearPendingHistoryCommit();
            routeRequestSeq++;

            if (snap.routingMode) {
                setRoutingMode(normalizeRoutingMode(snap.routingMode), { skipRecalc: true, silent: true });
            }

            currentWaypoints = snap.waypoints.map(wp => ({
                lat: Number(wp.lat),
                lng: Number(wp.lng),
                label: wp.label || '',
                notes: wp.notes || '',
                icon: normalizeWaypointIconId(wp.icon),
                direct: Boolean(wp.direct)
            }));
            currentRouteGeometry = Array.isArray(snap.geometry)
                ? snap.geometry.map(pt => ({ lat: Number(pt.lat), lng: Number(pt.lng) }))
                : [];
            currentRouteDistanceMeters = Number(snap.distanceMeters) || 0;

            syncMarkersToWaypoints();
            initRouting();

            if (currentWaypoints.length < 2) {
                if (routeLayerGroup) routeLayerGroup.clearLayers();
                routePolylineLayers = [];
                updateRouteDistanceDisplay();
            } else if (currentRouteGeometry.length >= 2) {
                const isFallbackLine = currentRoutingMode !== 'direct' &&
                    !currentWaypoints.some(w => w.direct) &&
                    areWaypointCoordsEqual(currentRouteGeometry, currentWaypoints);
                drawRouteLines(currentRouteGeometry, currentWaypoints, isFallbackLine);
                updateRouteDistanceDisplay(isFallbackLine ? `~${formatDistance(currentRouteDistanceMeters)}` : undefined);
            } else {
                updateRoutingWaypoints();
            }

            isRestoringHistory = false;
            updateUndoRedoButtons();
            refreshElevationProfile();
            scheduleAutoSave(450);
        }

        function undoRouteChange() {
            if (historyInputTimer) {
                recordHistoryState();
            }
            if (historyIndex <= 0) return;
            historyIndex -= 1;
            applyHistorySnapshot(historyStack[historyIndex]);
            showToast('Undid last change');
        }

        function redoRouteChange() {
            if (historyIndex < 0 || historyIndex >= historyStack.length - 1) return;
            historyIndex += 1;
            applyHistorySnapshot(historyStack[historyIndex]);
            showToast('Redid change');
        }

        function decodeValhallaPolyline6(encoded) {
            if (!encoded || typeof encoded !== 'string') return [];
            const coords = [];
            let index = 0;
            let lat = 0;
            let lng = 0;
            while (index < encoded.length) {
                let b;
                let shift = 0;
                let result = 0;
                do {
                    b = encoded.charCodeAt(index++) - 63;
                    result |= (b & 0x1f) << shift;
                    shift += 5;
                } while (b >= 0x20 && index < encoded.length);
                const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
                lat += dlat;

                shift = 0;
                result = 0;
                do {
                    b = encoded.charCodeAt(index++) - 63;
                    result |= (b & 0x1f) << shift;
                    shift += 5;
                } while (b >= 0x20 && index < encoded.length);
                const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
                lng += dlng;

                coords.push({
                    lat: Number((lat / 1e6).toFixed(6)),
                    lng: Number((lng / 1e6).toFixed(6))
                });
            }
            return coords;
        }

        async function snapSingleWaypointToRoad(reqId, targetHistoryIdx) {
            const cfg = getActiveRoutingConfig();
            if (!isRoadSnapEnabled || cfg.id === 'direct' || !cfg.locateUrl || currentWaypoints.length !== 1) return;
            const wp = currentWaypoints[0];
            if (wp.direct) return;

            const rawLatLng = L.latLng(wp.lat, wp.lng);
            const maxSnapMeters = getRoadSnapMaxMeters();

            try {
                const res = await fetch(cfg.locateUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        locations: [{
                            lat: wp.lat,
                            lon: wp.lng,
                            radius: maxSnapMeters,
                            ...(cfg.searchFilter ? { search_filter: cfg.searchFilter } : {})
                        }],
                        costing: cfg.costing,
                        costing_options: { [cfg.costing]: cfg.autoOptions || {} }
                    })
                });
                if (!res.ok) return;
                const data = await res.json();
                if (reqId !== routeRequestSeq || currentWaypoints.length !== 1 || !isRoadSnapEnabled || currentWaypoints[0].direct) return;

                const edges = Array.isArray(data) && data[0] && Array.isArray(data[0].edges) ? data[0].edges : [];
                let bestLatLng = null;
                let bestDist = Infinity;
                edges.forEach((edge) => {
                    const lat = Number(edge.correlated_lat);
                    const lng = Number(edge.correlated_lon);
                    if (!isFinite(lat) || !isFinite(lng)) return;
                    const candidate = L.latLng(lat, lng);
                    const dist = rawLatLng.distanceTo(candidate);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestLatLng = candidate;
                    }
                });

                if (bestLatLng && bestDist <= maxSnapMeters) {
                    currentWaypoints[0].lat = bestLatLng.lat;
                    currentWaypoints[0].lng = bestLatLng.lng;
                    if (waypointMarkers[0]) {
                        waypointMarkers[0].setLatLng(bestLatLng);
                    }
                    syncCurrentHistoryGeometry(targetHistoryIdx, true);
                }
            } catch (e) {
                // Retain exact dropped coordinate if locate request fails
            }
        }

        async function routeChainWithValhalla(cfg, sliceWps, searchRadius) {
            if (!cfg || !cfg.routeUrl || !Array.isArray(sliceWps) || sliceWps.length < 2) return null;

            const locations = sliceWps.map((wp) => ({
                lat: Number(wp.lat),
                lon: Number(wp.lng),
                type: 'break',
                radius: searchRadius,
                ...(cfg.searchFilter ? { search_filter: cfg.searchFilter } : {})
            }));

            try {
                const res = await fetch(cfg.routeUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        locations,
                        costing: cfg.costing,
                        costing_options: {
                            [cfg.costing]: cfg.autoOptions || {}
                        },
                        directions_options: {
                            units: 'km'
                        }
                    })
                });
                if (!res.ok) return null;
                const data = await res.json();
                const legs = data && data.trip && Array.isArray(data.trip.legs) ? data.trip.legs : null;
                if (!legs || legs.length !== sliceWps.length - 1) return null;

                const decodedLegs = legs.map((leg) => decodeValhallaPolyline6(leg.shape));
                if (decodedLegs.some(pts => pts.length < 2)) return null;
                return { legs: decodedLegs };
            } catch (e) {
                return null;
            }
        }

        function appendGeometryPoints(target, points) {
            points.forEach((pt) => {
                const lat = Number(pt.lat);
                const lng = Number(pt.lng);
                if (!isFinite(lat) || !isFinite(lng)) return;
                const last = target[target.length - 1];
                if (!last || Math.abs(last.lat - lat) > 1e-7 || Math.abs(last.lng - lng) > 1e-7) {
                    target.push({ lat, lng });
                }
            });
        }

        async function updateRoutingWaypoints() {
            initRouting();
            const reqId = ++routeRequestSeq;
            const targetHistoryIdx = historyIndex;

            if (currentWaypoints.length < 2) {
                currentRouteGeometry = [];
                currentRouteDistanceMeters = 0;
                if (routeLayerGroup) routeLayerGroup.clearLayers();
                routePolylineLayers = [];
                updateRouteDistanceDisplay();
                syncCurrentHistoryGeometry(targetHistoryIdx, false);
                if (currentWaypoints.length === 1 && isRoadSnapEnabled && currentRoutingMode !== 'direct') {
                    snapSingleWaypointToRoad(reqId, targetHistoryIdx);
                }
                refreshElevationProfile();
                return;
            }

            const cfg = getActiveRoutingConfig();

            // Pure Direct (Exact) mode or all legs marked direct
            const allLegsDirect = cfg.id === 'direct' ||
                currentWaypoints.slice(1).every(wp => Boolean(wp.direct));
            if (allLegsDirect || !cfg.routeUrl) {
                currentRouteGeometry = currentWaypoints.map(wp => ({ lat: wp.lat, lng: wp.lng }));
                currentRouteDistanceMeters = calculatePolylineDistanceMeters(currentRouteGeometry);
                drawRouteLines(currentRouteGeometry, currentWaypoints, false);
                updateRouteDistanceDisplay();
                syncCurrentHistoryGeometry(targetHistoryIdx, false);
                refreshElevationProfile();
                return;
            }

            // Show clean preview while routing
            currentRouteGeometry = [];
            renderPreviewRoutePolyline();
            updateRouteDistanceDisplay('Calculating...');

            // Partition consecutive non-direct legs into contiguous chains
            const legs = [];
            for (let i = 0; i < currentWaypoints.length - 1; i++) {
                legs.push({
                    fromIdx: i,
                    toIdx: i + 1,
                    isDirect: Boolean(currentWaypoints[i + 1].direct)
                });
            }

            const chains = [];
            let i = 0;
            while (i < legs.length) {
                if (legs[i].isDirect) {
                    i++;
                    continue;
                }
                const startWpIdx = legs[i].fromIdx;
                while (i < legs.length && !legs[i].isDirect) {
                    i++;
                }
                const endWpIdx = legs[i - 1].toIdx;
                chains.push({ startWpIdx, endWpIdx });
            }

            const maxSnapMeters = getRoadSnapMaxMeters();
            const valhallaSearchRadius = Math.max(150, maxSnapMeters);

            const chainResults = await Promise.all(chains.map(async (chain) => {
                const sliceWps = currentWaypoints.slice(chain.startWpIdx, chain.endWpIdx + 1);
                const route = await routeChainWithValhalla(cfg, sliceWps, valhallaSearchRadius);
                return { chain, route };
            }));

            if (reqId !== routeRequestSeq) return;

            const stitchedCoords = [];
            let anySnappedMarkers = false;
            let usedFallbackPreview = false;

            const chainByStart = new Map();
            chainResults.forEach(({ chain, route }) => {
                chainByStart.set(chain.startWpIdx, { chain, route });
                if (!route || !Array.isArray(route.legs) || route.legs.length === 0) return;

                const len = chain.endWpIdx - chain.startWpIdx + 1;
                for (let m = 0; m < len; m++) {
                    const globalIdx = chain.startWpIdx + m;
                    const wp = currentWaypoints[globalIdx];
                    if (!wp || wp.direct || !isRoadSnapEnabled) continue;

                    const snappedPt = (m === 0)
                        ? route.legs[0][0]
                        : route.legs[m - 1][route.legs[m - 1].length - 1];
                    if (snappedPt && isFinite(snappedPt.lat) && isFinite(snappedPt.lng)) {
                        const rawLatLng = L.latLng(wp.lat, wp.lng);
                        const snappedLatLng = L.latLng(snappedPt.lat, snappedPt.lng);
                        if (rawLatLng.distanceTo(snappedLatLng) <= maxSnapMeters) {
                            wp.lat = Number(snappedLatLng.lat);
                            wp.lng = Number(snappedLatLng.lng);
                            if (waypointMarkers[globalIdx]) {
                                waypointMarkers[globalIdx].setLatLng(snappedLatLng);
                            }
                            anySnappedMarkers = true;
                        }
                    }
                }
            });

            let legCursor = 0;
            while (legCursor < legs.length) {
                const leg = legs[legCursor];
                if (leg.isDirect) {
                    appendGeometryPoints(stitchedCoords, [
                        currentWaypoints[leg.fromIdx],
                        currentWaypoints[leg.toIdx]
                    ]);
                    legCursor++;
                    continue;
                }

                const entry = chainByStart.get(leg.fromIdx);
                const chain = entry ? entry.chain : { startWpIdx: leg.fromIdx, endWpIdx: leg.toIdx };
                const route = entry ? entry.route : null;
                const chainWps = currentWaypoints.slice(chain.startWpIdx, chain.endWpIdx + 1);

                if (!route || !Array.isArray(route.legs) || route.legs.length !== chainWps.length - 1) {
                    appendGeometryPoints(stitchedCoords, chainWps);
                    usedFallbackPreview = true;
                    legCursor = chain.endWpIdx;
                    continue;
                }

                for (let m = 0; m < chainWps.length - 1; m++) {
                    const wpA = chainWps[m];
                    const wpB = chainWps[m + 1];
                    const rawA = L.latLng(wpA.lat, wpA.lng);
                    const rawB = L.latLng(wpB.lat, wpB.lng);
                    const legCoords = route.legs[m] || [];

                    if (legCoords.length < 2) {
                        appendGeometryPoints(stitchedCoords, [wpA, wpB]);
                        usedFallbackPreview = true;
                        continue;
                    }

                    const firstSlicePt = L.latLng(legCoords[0].lat, legCoords[0].lng);
                    const lastSlicePt = L.latLng(legCoords[legCoords.length - 1].lat, legCoords[legCoords.length - 1].lng);
                    const legRoadMeters = calculatePolylineDistanceMeters(legCoords);

                    // Guard against collapsing two distant pins onto the same short off-route stub
                    if (rawA.distanceTo(rawB) > 60 && legRoadMeters < 15) {
                        appendGeometryPoints(stitchedCoords, [wpA, wpB]);
                        usedFallbackPreview = true;
                        continue;
                    }

                    const legPts = [];
                    if (rawA.distanceTo(firstSlicePt) > 6) {
                        legPts.push({ lat: rawA.lat, lng: rawA.lng });
                    }
                    legCoords.forEach(c => legPts.push({ lat: c.lat, lng: c.lng }));
                    if (rawB.distanceTo(lastSlicePt) > 6) {
                        legPts.push({ lat: rawB.lat, lng: rawB.lng });
                    }

                    appendGeometryPoints(stitchedCoords, legPts);
                }

                legCursor = chain.endWpIdx;
            }

            currentRouteGeometry = stitchedCoords.length >= 2
                ? stitchedCoords
                : currentWaypoints.map(wp => ({ lat: wp.lat, lng: wp.lng }));
            currentRouteDistanceMeters = calculatePolylineDistanceMeters(currentRouteGeometry);

            drawRouteLines(currentRouteGeometry, currentWaypoints, usedFallbackPreview);
            updateRouteDistanceDisplay(usedFallbackPreview ? `~${formatDistance(currentRouteDistanceMeters)}` : undefined);
            syncCurrentHistoryGeometry(targetHistoryIdx, anySnappedMarkers);
            refreshElevationProfile();
        }

                html: `
                    <div class="waypoint-badge" style="background: ${escapeHtml(iconMeta.color)};">
                        <span class="number" title="Drag to move">${index + 1}</span>
                        ${iconBadgeHtml}
                        <input
                            type="text"
                            class="waypoint-map-input"
                            value="${escapeHtml(wp.label || '')}"

                    </div>
